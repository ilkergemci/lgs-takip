<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LGS Takip</title>
<meta name="description" content="Oğlumun LGS hazırlığı için ödev ve deneme takip paneli">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f3f5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1222" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LGS Takip">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f7f9ff; --line:#e4e8f3;
    --ink:#1b2440; --ink-2:#5b6686; --ink-3:#8b93ad;
    --brand:#4f46e5; --brand-ink:#ffffff; --brand-soft:#ecebfd;
    --ok:#16a34a; --ok-soft:#e3f7ea; --warn:#d97706; --warn-soft:#fdf0db;
    --bad:#dc2626; --bad-soft:#fdeaea; --info:#0ea5e9;
    --okg:#1f9d3f; --kor:#d83b3b;
    --shadow:0 1px 2px rgba(27,36,64,.06),0 8px 24px rgba(27,36,64,.07);
    --r:16px; --r-sm:11px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1222; --surface:#171c30; --surface-2:#1e243c; --line:#2a3150;
      --ink:#eef1fb; --ink-2:#aab3d1; --ink-3:#7b84a4;
      --brand:#8b84ff; --brand-ink:#141425; --brand-soft:#241f49;
      --ok:#4ade80; --ok-soft:#14321f; --warn:#fbbf24; --warn-soft:#3a2c0e;
      --bad:#f87171; --bad-soft:#3a1618; --info:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
      --bg:#0e1222; --surface:#171c30; --surface-2:#1e243c; --line:#2a3150;
      --ink:#eef1fb; --ink-2:#aab3d1; --ink-3:#7b84a4;
      --brand:#8b84ff; --brand-ink:#141425; --brand-soft:#241f49;
      --ok:#4ade80; --ok-soft:#14321f; --warn:#fbbf24; --warn-soft:#3a2c0e;
      --bad:#f87171; --bad-soft:#3a1618; --info:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:var(--brand)}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7c74ff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
  .top h1{font-size:17px;margin:0;font-weight:750;letter-spacing:-.2px}
  .top .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .spacer{flex:1}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;font-size:16px}
  .icon-btn:active{transform:scale(.95)}

  h2.sec{font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-3);margin:22px 4px 10px;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:6px;font-weight:600}
  .muted{color:var(--ink-3)}
  .row{display:flex;align-items:center;gap:10px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 15px;border-radius:12px;font-size:14.5px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:active{transform:scale(.98)}
  .btn.brand{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
  .btn.block{width:100%}
  .btn.ok{background:var(--ok);color:#fff;border-color:transparent}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
  .chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  .chip.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
  label.fld{display:block;margin:12px 0 0}
  label.fld .lab{font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px;display:block}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:0;border-color:var(--brand)}
  .seg{display:flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1 1 auto;min-width:fit-content;white-space:nowrap;border:none;background:transparent;color:var(--ink-2);padding:9px 8px;border-radius:9px;font-weight:650;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .list>*+*{margin-top:10px}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .item .t{font-weight:680;font-size:14.5px}
  .item .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .barrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
  .barrow .nm{font-size:13.5px;font-weight:600}
  .bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#7c74ff)}
  .bar.bad>i{background:linear-gradient(90deg,#f0795a,var(--bad))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
  .tab{border:none;background:transparent;color:var(--ink-3);padding:7px 2px;border-radius:12px;font-size:10.5px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--brand)}
  .fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--brand-ink);border:none;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);font-size:26px;cursor:pointer;display:grid;place-items:center}
  .sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{position:relative;background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:52px 16px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:none}
  .grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 10px}
  .sheet-close{position:absolute;top:12px;left:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:18px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center}
  .sheet-close:active{background:var(--line)}
  .sheet .grab{position:absolute;top:9px;left:50%;transform:translateX(-50%);margin:0}
  .sheet h3{margin:4px 2px 2px;font-size:19px;font-weight:760;letter-spacing:-.3px}
  .sheet .hint{font-size:13px;color:var(--ink-3);margin:0 2px 8px}
  /* Optik cevap formu — sınav kapısı tonu (pembe-kahve) */
  .optik-wrap{--opk-line:#c98f7c;--opk-ink:#9c5742;--opk-head:#f6e6de;--okg:#1f9d3f;--kor:#d83b3b;border:2px solid var(--opk-line);border-radius:12px;overflow:hidden;margin-top:10px;background:var(--surface)}
  .optik-head{background:var(--opk-head);text-align:center;font-weight:800;font-size:12px;letter-spacing:.18em;padding:9px;border-bottom:2px solid var(--opk-line);color:var(--opk-ink)}
  .answers{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:440px){ .answers{grid-template-columns:1fr 1fr} .answers .acell:nth-child(odd){border-right:2px solid var(--opk-line)} }
  .acell{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1.5px solid var(--opk-line)}
  .acell .qn{width:24px;text-align:center;font-weight:800;font-size:13px;color:var(--opk-ink);flex:none}
  .acell .opts{display:flex;gap:11px;flex:1;justify-content:flex-start}
  .acell .opts b{width:30px;height:30px;line-height:26px;text-align:center;border:2px solid var(--opk-line);border-radius:50%;font-size:12px;font-weight:700;color:var(--opk-ink);cursor:pointer;background:var(--surface);transition:background .1s,box-shadow .1s,color .1s;-webkit-tap-highlight-color:transparent}
  /* öğrenci işareti — sınav sürerken kutunun içi dolu */
  .acell .opts b.marked{background:var(--opk-ink);border-color:var(--opk-ink);color:#fff}
  /* kontrol sonrası */
  .acell .opts b.ringok{box-shadow:0 0 0 3px var(--okg)}                                  /* doğru işaret → kalın yeşil halka */
  .acell .opts b.ringko{box-shadow:0 0 0 3px var(--kor)}                                  /* yanlış işaret → kalın kırmızı halka */
  .acell .opts b.fillok{background:var(--okg);border-color:var(--okg);color:#fff}         /* doğru şıkkın içi yeşil dolu */
  .answers.locked .opts b{cursor:default}                                                /* kontrol sonrası form kilitli */
  .acell .cam-btn{flex:none;width:34px;height:30px;border:2px solid var(--kor);background:var(--surface);color:var(--kor);border-radius:8px;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .acell .cam-btn.done{border-color:var(--okg);background:var(--okg);color:#fff}
  .acell .cam-btn.busy{border-color:var(--ink-3);color:var(--ink-3);opacity:.7}
  .ca-review{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;margin:10px 0}
  .caq{border:1.5px solid var(--line);border-radius:9px;padding:5px 2px 4px;text-align:center;background:var(--surface)}
  .caq .caq-n{font-size:10px;color:var(--ink-3);line-height:1.1}
  .caq .caq-a{font-weight:800;font-size:15px;margin-top:1px;line-height:1.1}
  .caq .caq-s{font-size:9.5px;display:block;margin-top:1px;color:var(--ink-3)}
  .caq.ok{border-color:var(--okg);background:color-mix(in srgb,var(--okg) 9%,var(--surface))} .caq.ok .caq-a,.caq.ok .caq-s{color:var(--okg)}
  .caq.wrong{border-color:var(--kor);background:color-mix(in srgb,var(--kor) 11%,var(--surface))} .caq.wrong .caq-a,.caq.wrong .caq-s{color:var(--kor)}
  .caq.blank{border-color:var(--ink-3);background:color-mix(in srgb,var(--ink-3) 10%,var(--surface))}
  .ck-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
  .ck-row:first-child{border-top:0}
  .ck-row .konu-sel{flex:1;max-width:64%;padding:8px 9px;font-size:12.5px;border-radius:9px}
  .cozum-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 13px 7px 20px;border-top:1px dashed var(--line);cursor:pointer}
  .ck-row .vbtn{flex:none;padding:7px 9px;font-size:13px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--brand);cursor:pointer}
  .soru-chip{padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);font-size:13px;font-weight:650;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .soru-chip.has{border-color:var(--okg);color:var(--okg)}
  #ot_testler{max-height:300px;overflow:auto}
  .otcheck{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13.5px;-webkit-tap-highlight-color:transparent}
  .otcheck input{width:19px;height:19px;flex:none;accent-color:var(--brand)}
  .otcheck.ekli{opacity:.55;cursor:default}
  .vek-ed{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
  .vek-ed.open{display:flex}
  .vek-top{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:7px 8px}
  .vek-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .vek-tools button,.vek-tools select,.vek-tools input[type=color]{font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink);cursor:pointer;width:auto;min-height:36px;line-height:1}
  .vek-tools input[type=color]{padding:2px;width:40px;height:36px}
  .vek-tools button.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  .vek-tools .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px;min-height:28px}
  .vek-tools .grow{flex:1}
  .vek-tools .save{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:700}
  .vek-ttl{font-size:12px;color:var(--ink-3);padding:2px 2px 6px;font-weight:650}
  .vek-main{flex:1;display:flex;min-height:0}
  .vek-stage{flex:1;min-width:0;overflow:hidden;background:var(--surface-2);position:relative}
  .vek-stage .canvas-container{box-shadow:none}
  .vek-ref{display:none;position:relative;overflow:hidden;background:#111;touch-action:none}
  .vek-ref.show{display:block}
  .vek-ref img{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;cursor:grab}
  .vek-ref .refhint{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 7px;border-radius:7px;pointer-events:none}
  .vek-ref .ref-rot{position:absolute;top:8px;right:8px;z-index:3;width:36px;height:36px;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  @media(min-width:820px){ .vek-ref.show{flex:0 0 46%;max-width:46%;border-left:1px solid var(--line)} }
  @media(max-width:819px){ .vek-main{flex-direction:column} .vek-ref.show{flex:0 0 42vh;border-top:1px solid var(--line)} }
  .tkimg-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:auto;max-height:46vh;display:flex;justify-content:center}
  .tkimg{max-width:100%;height:auto;display:block}
  .tk-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tk-opt{padding:14px 0;font-size:18px;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;cursor:pointer}
  .tk-opt:disabled{cursor:default;opacity:.95}
  .tk-opt.ok{border-color:var(--okg);background:var(--okg);color:#fff}
  .tk-opt.ko{border-color:var(--kor);background:var(--kor);color:#fff}
  .acell.needphoto{background:color-mix(in srgb, var(--kor) 7%, transparent)}
  .photostat{margin-top:10px;font-size:13px;font-weight:650;color:var(--kor);background:color-mix(in srgb, var(--kor) 10%, transparent);border:1px solid color-mix(in srgb,var(--kor) 35%,transparent);border-radius:10px;padding:9px 12px}
  .photostat.ok{color:var(--okg);background:color-mix(in srgb,var(--okg) 12%,transparent);border-color:color-mix(in srgb,var(--okg) 35%,transparent)}
  .photo-thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .photo-thumbs a{display:block;width:46px;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative}
  .photo-thumbs a img{width:100%;height:100%;object-fit:cover}
  .photo-thumbs a span{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:1px 3px;border-top-right-radius:5px}
  details > summary{list-style:none} details > summary::-webkit-details-marker{display:none}
  .konu-pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:6px}
  .kline{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px}
  .kline:nth-child(odd){background:var(--surface-2)}
  .kline .kn{flex:1;font-size:13.5px}
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;line-height:1}
  .step span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--ink-3);padding:30px 10px;font-size:14px}
  .gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
  .gate .box{width:100%;max-width:320px;text-align:center}
  .pin{letter-spacing:10px;text-align:center;font-size:24px;font-weight:800}
  .tiny{font-size:11.5px;color:var(--ink-3)}
  .split{display:flex;gap:8px}.split>*{flex:1}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--brand-soft);color:var(--brand)}
  .net-big{font-size:30px;font-weight:850;letter-spacing:-1px}
  .hidden{display:none!important}
  .sk{height:70px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="logo" style="margin:0 auto 14px;width:52px;height:52px;border-radius:16px;font-size:22px">LGS</div>
    <h1 style="margin:0 0 4px;font-size:22px">LGS Takip</h1>
    <p class="muted" style="margin:0 0 18px;font-size:14px">Devam etmek için PIN gir</p>
    <input id="pinInput" class="pin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
    <button class="btn brand block" style="margin-top:14px" id="pinBtn">Giriş</button>
    <p class="tiny" id="pinErr" style="margin-top:10px;color:var(--bad);visibility:hidden">Hatalı PIN</p>
  </div>
</div>

<header class="top hidden" id="appTop">
  <div class="top-in">

/* ---- Bildirimler (web push) ---- */
function _u8(b64){ const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); const a=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i); return a; }
function bildirimDurum(){ try{ return ('Notification'in window)? Notification.permission : 'yok'; }catch(_){ return 'yok'; } }
async function bildirimAc(){
  if(!('serviceWorker'in navigator) || !('PushManager'in window) || !('Notification'in window)){ toast('Bu cihaz/ tarayıcı bildirim desteklemiyor'); return; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('Bildirim izni verilmedi'); return; }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:_u8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await db.from('push_aboneleri').upsert({endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, ua:navigator.userAgent},{onConflict:'endpoint'});
    if(error){ toast('Abonelik kaydedilemedi'); return; }
    toast('Bildirimler açıldı ✓'); if(S.view==='ozet') renderOzet();
  }catch(e){ toast('Bildirim açılamadı: '+(e.message||e)); }
}

function openGate(){

  if(sessionStorage.getItem('lgs_ok')==='1'){ S.role=sessionStorage.getItem('lgs_role')||'ogrenci'; g.style.display='none'; startApp(); return; }

(function initTheme(){ const t=localStorage.getItem('lgs_theme'); if(t) document.documentElement.setAttribute('data-theme',t); })();
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;

/* ---------- DATA LOAD ---------- */
async function loadCatalog(){
  const [dr, ko, ma] = await Promise.all([
    db.from('dersler').select('*').order('sira'),
    db.from('konular').select('id,ders_id,ad,unite,sira').order('sira'),
    db.from('materyaller').select('id,ad,yayin,ders_id,tur').order('ad')
  ]);
  if(dr.error||ko.error||ma.error){ throw (dr.error||ko.error||ma.error); }
  S.dersler = dr.data;
  S.konby={}; S.konByDers={};
  ko.data.forEach(k=>{ S.konby[k.id]=k; (S.konByDers[k.ders_id]=S.konByDers[k.ders_id]||[]).push(k); });
  S.matByDers={}; S.matById={};
  ma.data.forEach(m=>{ S.matById[m.id]=m; (S.matByDers[m.ders_id]=S.matByDers[m.ders_id]||[]).push(m); });
}
const dersAd = id => (S.dersler.find(d=>d.id==id)||{}).ad || "—";

async function testsOf(materyalId){
  const {data,error}=await db.from('materyal_testleri').select('id,unite,bolum,tip,test_no,konu_id,soru_sayisi').eq('materyal_id',materyalId).order('test_no');
  if(error){toast('Testler yüklenemedi');return[];}
  (data||[]).sort((a,b)=>testLabel(a).localeCompare(testLabel(b),'tr',{numeric:true,sensitivity:'base'})); // harf sırası (sayılar doğru)
  return data;
}
function testLabel(t){
  let s = t.unite || '';
  if(t.test_no!=null){ const b=(t.bolum && t.bolum!=='Test')? t.bolum : 'Test'; s += (s?' · ':'')+b+' '+t.test_no; }
  return s || ('Test #'+t.id);
}
function soruStr(n){ return (n!=null && +n>0)? (+n)+' soru' : ''; }
function testOpt(t){ const q=soruStr(t.soru_sayisi); return esc(testLabel(t))+(q?' ('+q+')':''); }

/* ---------- VIEWS ---------- */
const TITLES={ozet:['Özet','Genel durum'],kitap:['Kitaplar','Kitap bazında ilerleme'],odev:['Ödevler','Okul & dershane ödevleri'],sonuc:['Sonuç Gir','Test & deneme sonuçları'],analiz:['Analiz','Konu bazında zayıflık'],tekrar:['Tekrar','Yanlış soruları yeniden çöz']};

/* ----- ÖZET ----- */
async function renderOzet(){
  const el=$('#view-ozet');
  el.innerHTML=`<div style="margin-top:16px" class="grid3">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
  const [odevR, sonR, ykR] = await Promise.all([
    db.from('odevler').select('id,durum,teslim_tarihi,baslik,ders_id,kaynak,materyal').order('teslim_tarihi',{nullsFirst:false}),
    db.from('sonuclar').select('id,dogru,yanlis,bos,net,cozum_tarihi,deneme_id,odev_id,ders_id,denemeler(ad,tarih)').order('cozum_tarihi',{ascending:false}).limit(60),
    db.from('yanlis_konular').select('konu_id,adet')
  ]);
  const odev=odevR.data||[], son=sonR.data||[], yk=ykR.data||[];
  const today=todayISO();
  const notDone=odev.filter(o=>o.durum!=='yapildi');
  const gecikti=notDone.filter(o=>o.teslim_tarihi && o.teslim_tarihi<today);   // teslim geçmiş
  const bekle=notDone.filter(o=>!(o.teslim_tarihi && o.teslim_tarihi<today));  // veriliş–teslim arası (aktif)
  const haftaBasi=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const buHafta=son.filter(s=>s.cozum_tarihi>=haftaBasi).length;
  // weak topics
  const agg={}; yk.forEach(r=>{ agg[r.konu_id]=(agg[r.konu_id]||0)+(r.adet||1); });
  const weak=Object.entries(agg).map(([id,n])=>({k:S.konby[id],n})).filter(x=>x.k).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxW=weak.length?weak[0].n:1;
  // recent denemeler (group by deneme)
  const denMap={};
  son.filter(s=>s.deneme_id).forEach(s=>{ const d=denMap[s.deneme_id]=denMap[s.deneme_id]||{ad:s.denemeler?.ad||'Deneme',tarih:s.denemeler?.tarih,net:0}; d.net+=net(s.dogru,s.yanlis); });
  const dens=Object.values(denMap).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||'')).slice(0,5);

  el.innerHTML = `
    <div class="grid3" style="margin-top:16px">
      <div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="goOdev('bekliyor')"><div class="n">${bekle.length}</div><div class="l">Bekleyen ödev ›</div></div>
      <div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="goOdev('geciken')"><div class="n" style="color:var(--${gecikti.length?'bad':'ink'})">${gecikti.length}</div><div class="l">Geciken ›</div></div>
      <div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="goOdev('yapildi')"><div class="n">${buHafta}</div><div class="l">Bu hafta çözülen ›</div></div>
    </div>

    ${('Notification'in window)?`<div class="card pad" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px">
      <div style="min-width:0"><div style="font-weight:650;font-size:13.5px">🔔 Bildirimler</div><div class="tiny">${bildirimDurum()==='granted'?'Açık · her akşam 19:00 hatırlatma':'Her akşam 19:00 ödev hatırlatması'}</div></div>
      <div class="row" style="gap:6px;flex:none">
        ${bildirimDurum()==='granted'?`<button class="btn sm" onclick="bildirimTest()">Test</button>`:''}
        <button class="btn sm brand" onclick="bildirimAc()">${bildirimDurum()==='granted'?'Yenile':'Aç'}</button>
      </div>
    </div>`:''}

    <h2 class="sec">En zayıf konular</h2>
    <div class="card pad" ${weak.length?'role="button" tabindex="0" style="cursor:pointer" onclick="setView(\'analiz\')"':''}>
      ${weak.length? weak.map(w=>`
        <div style="margin-top:2px">
          <div class="barrow"><div class="nm">${esc(w.k.ad)} <span class="tiny">· ${dersAd(w.k.ders_id)}</span></div><span class="chip bad">${w.n} yanlış</span></div>
          <div class="bar bad"><i style="width:${Math.max(8,w.n/maxW*100)}%"></i></div>
        </div>`).join('') : `<div class="empty">Henüz yanlış konu verisi yok.<br>Sonuç girdikçe burada en çok zorlandığı konular çıkacak.</div>`}
    </div>

    <h2 class="sec">Son denemeler</h2>
    <div class="list">
      ${dens.length? dens.map(d=>`
        <div class="item"><div class="dot" style="background:var(--brand)"></div>
          <div style="flex:1"><div class="t">${esc(d.ad)}</div><div class="d">${trDate(d.tarih)}</div></div>
          <div class="net-big" style="font-size:20px">${d.net.toFixed(2).replace('.',',')}<span class="tiny"> net</span></div>
        </div>`).join('') : `<div class="empty">Henüz deneme sonucu girilmedi.</div>`}
    </div>

    <h2 class="sec">Hızlı işlem</h2>
    <div class="split">
      <button class="btn brand" onclick="openOdevForm()">＋ Ödev ekle</button>
      <button class="btn" onclick="setView('sonuc')">＋ Sonuç gir</button>
    </div>`;
}

/* ----- ÖDEVLER ----- */
let odevFilter='bekliyor';
function goOdev(f){ odevFilter=f||'bekliyor'; setView('odev'); }
async function renderOdev(){
  const el=$('#view-odev');
  el.innerHTML=`<div style="margin-top:16px" class="seg" id="ofSeg">
      <button data-f="geciken" class="${odevFilter==='geciken'?'on':''}">Geciken</button>
      <button data-f="bekliyor" class="${odevFilter==='bekliyor'?'on':''}">Bekleyen</button>
      <button data-f="yapildi" class="${odevFilter==='yapildi'?'on':''}">Yapıldı</button>
      <button data-f="testsiz" class="${odevFilter==='testsiz'?'on':''}">Testsiz</button>
      <button data-f="hepsi" class="${odevFilter==='hepsi'?'on':''}">Hepsi</button>
    </div>
    <button class="btn brand block" style="margin-top:12px" onclick="openOdevForm()">＋ Yeni ödev</button>
    <div id="odevList" class="list" style="margin-top:14px"><div class="sk"></div><div class="sk"></div></div>`;
  $$('#ofSeg button').forEach(b=>b.onclick=()=>{odevFilter=b.dataset.f;renderOdev();});
  const q=db.from('odevler').select('*').order('teslim_tarihi',{nullsFirst:false}).order('verilis_tarihi',{ascending:false});
  const {data:raw,error}=await q;
  const list=$('#odevList');
  if(error){list.innerHTML=`<div class="empty">Yüklenemedi: ${esc(error.message)}</div>`;return;}
  // bağlı testi olan ödevler
  const {data:otLinks}=await db.from('odev_test').select('odev_id');
  const hasTests=new Set((otLinks||[]).map(x=>x.odev_id));
  const today=todayISO();
  const gecMi=o=>o.durum!=='yapildi' && o.teslim_tarihi && o.teslim_tarihi<today;
  let data=raw||[];
  if(odevFilter==='geciken') data=data.filter(gecMi);
  else if(odevFilter==='bekliyor') data=data.filter(o=>o.durum!=='yapildi' && !gecMi(o));
  else if(odevFilter==='yapildi') data=data.filter(o=>o.durum==='yapildi');
  else if(odevFilter==='testsiz') data=data.filter(o=>!hasTests.has(o.id));
  if(!data.length){list.innerHTML=`<div class="empty">${odevFilter==='testsiz'?'Test bilgisi girilmemiş ödev yok 🎉':'Bu filtrede ödev yok.'}</div>`;return;}
  const srcIcon={okul:'🏫',dershane:'📘',veli:'👨‍👩‍👦',diger:'•'};
  const srcLabel={dershane:'Dershane',okul:'Okul',veli:'Veli',diger:'Diğer'};
  const card=o=>{
    const gec = o.durum!=='yapildi' && o.teslim_tarihi && o.teslim_tarihi<todayISO();
    const col = o.durum==='yapildi'?'ok':(gec?'bad':'warn');
    return `<div class="item">
      <div class="dot" style="background:var(--${col})"></div>
      <div style="flex:1;min-width:0;cursor:pointer" onclick="odevAc(${o.id})" title="Detay / sonuç gir">
        <div class="t">${esc(o.baslik||'Ödev')} <span style="color:var(--ink-3);font-weight:600">›</span></div>
        <div class="d">${esc(o.kurum||srcLabel[o.kaynak]||o.kaynak)} · ${dersAd(o.ders_id)}${o.materyal?' · '+esc(o.materyal):''}${o.teslim_tarihi?' · teslim '+trDate(o.teslim_tarihi):''}</div>
      </div>
      ${o.durum==='yapildi' ? `<span class="chip ok">✓</span>` : ''}
    </div>`;
  };
  const groups={}; data.forEach(o=>{(groups[o.kaynak]=groups[o.kaynak]||[]).push(o);});
  let html='';

// Fotoğrafı tarayıcıda küçült (en fazla ~1280px, JPEG) → küçük dosya
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(Math.max(w,h)>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(b=> b?resolve(b):reject(new Error('blob')), 'image/jpeg', quality);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}
// Yüklenen yanlış-foto satırları için vektörleme (Claude → SVG) edge function'ını tetikle (arka planda)
function vektorleBaslat(rows){
  (rows||[]).forEach(r=>{ if(!r||!r.id) return;
    db.functions.invoke('vektorle',{body:{foto_id:r.id}}).catch(()=>{}); // sessiz; durum DB'de tutulur
  });

function blobToImage(blob){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));}; im.src=u; }); }
// Kurşun kalem izlerini algoritmik temizle: aydınlatmayı düzleştir, gri izleri beyazlat; baskı ve renkli borular korunur
async function temizleFoto(blob){
  try{
    const img=await blobToImage(blob);
    const W=img.naturalWidth||img.width, H=img.naturalHeight||img.height;
    if(!W||!H) return blob;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const ctx=c.getContext('2d',{willReadFrequently:true}); ctx.drawImage(img,0,0);
    const bc=document.createElement('canvas'); bc.width=W; bc.height=H;
    const bctx=bc.getContext('2d');
    const rad=Math.max(12,Math.round(Math.min(W,H)*0.03));
    bctx.filter='blur('+rad+'px)';
    if(!bctx.filter || bctx.filter==='none') return blob;   // tarayıcı blur desteklemiyor → temizliği atla
    bctx.drawImage(img,0,0);
    const src=ctx.getImageData(0,0,W,H), bg=bctx.getImageData(0,0,W,H);
    const s=src.data, g=bg.data;
    for(let i=0;i<s.length;i+=4){
      const r=s[i],gr=s[i+1],b=s[i+2];
      const mx=Math.max(r,gr,b),mn=Math.min(r,gr,b);
      const sat=mx>0?(mx-mn)/mx:0;
      const lum=0.299*r+0.587*gr+0.114*b;
      const bl=0.299*g[i]+0.587*g[i+1]+0.114*g[i+2];
      const norm=bl>1?Math.min(255,lum/bl*255):255;
      if(sat>=0.28) continue;           // renkli boru → bırak
      if(norm<150) continue;            // koyu baskı → bırak
      s[i]=255;s[i+1]=255;s[i+2]=255;   // gri kalem izi / zemin → beyaz
    }
    ctx.putImageData(src,0,0);
    return await new Promise(res=>c.toBlob(b=>res(b||blob),'image/jpeg',0.82));
  }catch(_){ return blob; }   // hata → orijinali kullan
}
// ctx.photos (orijinal) + ctx.photosTemiz (temiz) → Storage; her ikisini de yükle
async function uploadPhotos(ctx){
  const need=ctx._needQs||[]; const out=[];
  for(const item of need){
    const q=item.q, tip=item.tip;
    const blob=ctx.photos[q]; if(!blob) continue;
    const base=`${ctx.test.id}/${Date.now()}_${q}`;
    const up=await db.storage.from('yanlis-foto').upload(base+'.jpg', blob, {contentType:'image/jpeg', upsert:true});
    if(up.error) throw up.error;
    const url=db.storage.from('yanlis-foto').getPublicUrl(base+'.jpg').data.publicUrl;
    let temiz_path=null, temiz_url=null;
    const tblob=(ctx.photosTemiz||{})[q];
    if(tblob){
      const tp=base+'_temiz.jpg';
      const tu=await db.storage.from('yanlis-foto').upload(tp, tblob, {contentType:'image/jpeg', upsert:true});
      if(!tu.error){ temiz_path=tp; temiz_url=db.storage.from('yanlis-foto').getPublicUrl(tp).data.publicUrl; }
    }
    out.push({soru_no:q, tip, foto_path:base+'.jpg', foto_url:url, temiz_path, temiz_url});
  }
  return out;
}

  $('#netOut').textContent=fnet(d,y); $('#dybOut').textContent=`${d} / ${y} / ${b}`;
  const needSet=new Set(needQs.map(n=>n.q));
  $$('#ansGrid .acell').forEach(cell=>{
    const q=+cell.dataset.q;
    const corr=(ctx.CA.find(c=>c.soru_no==q)||{}).dogru_cevap;
    const a=ctx.answers[q];
    $$('b',cell).forEach(x=>x.classList.remove('fillok','ringok','ringko'));
    // doğru şıkkın içini her durumda yeşil doldur (doğru / yanlış / boş)
    const cb=$$('b',cell).find(x=>x.dataset.o===corr); if(cb)cb.classList.add('fillok');

      const solved=new Set((sols||[]).map(s=>s.materyal_test_id));

let analizDers='';
function kisaKitap(s){ s=s||''; return s.length>26 ? s.slice(0,24)+'…' : s; }
function basariClass(b){ return b>=70?'ok':(b>=40?'warn':'bad'); }
let analizPeriod='gun';
function niceMax(v){ v=Math.max(1,v); const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; const m=n<=1?1:n<=2?2:n<=5?5:10; return m*p; }
function periodKey(iso, period){
  if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); if(!y||!m||!d) return null;
  if(period==='ay') return {key:`${y}-${String(m).padStart(2,'0')}`, label:`${String(m).padStart(2,'0')}.${String(y).slice(2)}`};
  if(period==='hafta'){ const dt=new Date(Date.UTC(y,m-1,d)); const off=(dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-off);
    const wy=dt.getUTCFullYear(),wm=dt.getUTCMonth()+1,wd=dt.getUTCDate();
    return {key:`${wy}-${String(wm).padStart(2,'0')}-${String(wd).padStart(2,'0')}`, label:`${String(wd).padStart(2,'0')}.${String(wm).padStart(2,'0')}`}; }
  return {key:iso, label:`${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}`};
}
function bucketSolved(rows, period){
  const map={};
  rows.forEach(r=>{ const iso=r.cozum_tarihi||(r.created_at?String(r.created_at).slice(0,10):null); const pk=periodKey(iso,period); if(!pk)return;
    const soru=(r.dogru||0)+(r.yanlis||0)+(r.bos||0); const b=map[pk.key]||(map[pk.key]={key:pk.key,label:pk.label,soru:0,dogru:0}); b.soru+=soru; b.dogru+=(r.dogru||0); });
  const arr=Object.values(map).sort((a,b)=>a.key<b.key?-1:1);
  arr.forEach(b=>b.basari=b.soru?Math.round(b.dogru/b.soru*100):0);
  return arr;
}
function comboChartSVG(b){
  if(!b.length) return `<div class="empty" style="padding:16px">Bu aralıkta veri yok.</div>`;
  const W=700,H=300,ml=40,mr=46,mt=28,mb=46; const x0=ml,x1=W-mr,y0=mt,y1=H-mb;
  const n=b.length, step=(x1-x0)/n; const cMax=niceMax(Math.max(...b.map(d=>d.soru)));
  const yC=v=>y1-(v/cMax)*(y1-y0), yP=v=>y1-(v/100)*(y1-y0); const bw=Math.min(40, step*0.62);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:inherit">`;
  s+=`<text x="${x0}" y="14" style="fill:var(--brand)" font-size="11" font-weight="700">▮ çözülen soru</text>`;
  s+=`<text x="${x1}" y="14" text-anchor="end" style="fill:var(--okg)" font-size="11" font-weight="700">— başarı %</text>`;
  [0,cMax/2,cMax].forEach(t=>{ const y=yC(t); s+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>`;
    s+=`<text x="${x0-6}" y="${(y+4).toFixed(1)}" text-anchor="end" style="fill:var(--ink-3)" font-size="11">${Math.round(t)}</text>`; });
  [0,50,100].forEach(p=>{ const y=yP(p); s+=`<text x="${x1+6}" y="${(y+4).toFixed(1)}" style="fill:var(--ink-3)" font-size="11">%${p}</text>`; });
  b.forEach((d,i)=>{ const cx=x0+step*(i+0.5), by=yC(d.soru);
    s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y1-by).toFixed(1)}" rx="3" style="fill:var(--brand)"/>`;
    const tall=(y1-by)>=24;
    s+=`<text x="${cx.toFixed(1)}" y="${(tall?by+15:by-5).toFixed(1)}" text-anchor="middle" style="fill:${tall?'#fff':'var(--ink-2)'}" font-size="11" font-weight="700">${d.soru}</text>`;
    s+=`<text x="${cx.toFixed(1)}" y="${(y1+15).toFixed(1)}" text-anchor="middle" style="fill:var(--ink-3)" font-size="10">${esc(d.label)}</text>`; });
  const pts=b.map((d,i)=>`${(x0+step*(i+0.5)).toFixed(1)},${yP(d.basari).toFixed(1)}`).join(' ');
  s+=`<polyline points="${pts}" fill="none" style="stroke:var(--okg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  b.forEach((d,i)=>{ const cx=x0+step*(i+0.5), cy=yP(d.basari);
    s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.2" style="fill:var(--okg)"/>`;
    s+=`<text x="${cx.toFixed(1)}" y="${(cy-7).toFixed(1)}" text-anchor="middle" style="fill:var(--okg)" font-size="10" font-weight="700">%${d.basari}</text>`; });
  s+=`</svg>`; return s;
}

async function renderAnaliz(){
  const el=$('#view-analiz');
  const dersOpts=`<option value="">Tüm dersler</option>`+S.dersler.map(d=>`<option value="${d.id}" ${analizDers==d.id?'selected':''}>${esc(d.ad)}</option>`).join('');
  el.innerHTML=`<label class="fld" style="margin-top:16px"><span class="lab">Ders</span><select id="an_ders">${dersOpts}</select></label>
    <div id="an_body" style="margin-top:14px"><div class="sk"></div><div class="sk"></div></div>`;
  $('#an_ders').onchange=()=>{analizDers=$('#an_ders').value;renderAnaliz();};
  const body=$('#an_body');

  // Sonuçlar (net / başarı) + yanlış konular
  let sq=db.from('sonuclar').select('ders_id,dogru,yanlis,bos,net,cozum_tarihi,created_at,materyal_testleri(test_no,bolum,unite,materyal_id,materyaller(ad))').order('created_at',{ascending:true});
  if(analizDers) sq=sq.eq('ders_id',analizDers);
  const {data:sonuc}=await sq;
  const srows=(sonuc||[]).filter(r=>r);
  const {data:ykData}=await db.from('yanlis_konular').select('adet,konu_id,konular(ad,ders_id)');
  let yk=(ykData||[]);
  if(analizDers) yk=yk.filter(r=>r.konular && r.konular.ders_id==analizDers);

  if(!srows.length && !yk.length){
    body.innerHTML=`<div class="empty">Henüz sonuç yok.<br>Test/deneme çözüldükçe burada net gelişimi, kitap başarısı ve konu zayıflığı çıkacak.</div>`;
    return;
  }

  let h='';
  if(srows.length){
    const td=srows.reduce((s,r)=>s+(r.dogru||0),0);
    const ty=srows.reduce((s,r)=>s+(r.yanlis||0),0);
    const tb=srows.reduce((s,r)=>s+(r.bos||0),0);
    const toplamSoru=td+ty+tb;
    const basari= toplamSoru? Math.round(td/toplamSoru*100):0;
    const toplamNet=srows.reduce((s,r)=>s+(+r.net||0),0);
    h+=`<div class="row" style="gap:8px;margin-bottom:12px">
      <div class="stat" style="flex:1"><div class="n">${srows.length}</div><div class="l">Çözülen test</div></div>
      <div class="stat" style="flex:1"><div class="n">%${basari}</div><div class="l">Başarı</div></div>
      <div class="stat" style="flex:1"><div class="n">${toplamNet.toFixed(1)}</div><div class="l">Toplam net</div></div>
    </div>
    <div class="card pad" style="margin-bottom:14px">
      <div class="tiny" style="font-weight:700;margin-bottom:6px">Doğru · Yanlış · Boş</div>
      <div class="barrow"><span class="nm">Doğru</span><span class="chip ok">${td}</span></div>
      <div class="barrow"><span class="nm">Yanlış</span><span class="chip bad">${ty}</span></div>
      <div class="barrow"><span class="nm">Boş</span><span class="chip warn">${tb}</span></div>
    </div>`;

    // Günlük çözülen soru + başarı (çift eksenli kombo grafik)
    h+=`<h2 class="sec">Çözüm temposu & başarı</h2>
      <div class="card pad" style="margin-bottom:14px">
        <div class="row" id="an_periods" style="gap:6px;margin-bottom:10px">
          <button class="btn sm" data-period="gun">Günlük</button>
          <button class="btn sm" data-period="hafta">Haftalık</button>
          <button class="btn sm" data-period="ay">Aylık</button>
        </div>
        <div id="an_chart"></div>
      </div>`;

    // Net gelişimi (son 15, kronolojik)
    const last=srows.slice(-15);
    h+=`<h2 class="sec">Net gelişimi</h2><div class="card pad" style="margin-bottom:14px">`+
      last.map(r=>{
        const t=r.materyal_testleri; const kit=t&&t.materyaller?t.materyaller.ad:'';
        const soru=(r.dogru||0)+(r.yanlis||0)+(r.bos||0);
        const b= soru? Math.round((r.dogru||0)/soru*100):0;
        const lbl=(t?((t.bolum||'Test')+' '+(t.test_no||'')):'Test');
        return `<div style="margin-top:4px">
          <div class="barrow"><div class="nm">${esc(lbl)} <span class="tiny">· ${esc(kisaKitap(kit))} · ${trDate(r.cozum_tarihi)}</span></div><span class="chip ${basariClass(b)}">net ${(+r.net).toFixed(2)}</span></div>
          <div class="bar ${b<40?'bad':''}"><i style="width:${Math.max(5,b)}%"></i></div>
        </div>`;
      }).join('')+`</div>`;

    // Kitap bazında başarı
    const byKit={};
    srows.forEach(r=>{ const t=r.materyal_testleri; const kit=t&&t.materyaller?t.materyaller.ad:'(diğer)'; const soru=(r.dogru||0)+(r.yanlis||0)+(r.bos||0); byKit[kit]=byKit[kit]||{d:0,s:0,n:0}; byKit[kit].d+=(r.dogru||0); byKit[kit].s+=soru; byKit[kit].n+=1; });
    const kitList=Object.entries(byKit).map(([k,v])=>({ad:k,basari:v.s?Math.round(v.d/v.s*100):0,n:v.n})).sort((a,b)=>b.basari-a.basari);
    h+=`<h2 class="sec">Kitap bazında başarı</h2><div class="card pad" style="margin-bottom:14px">`+
      kitList.map(x=>`<div style="margin-top:4px">
        <div class="barrow"><div class="nm">${esc(kisaKitap(x.ad))} <span class="tiny">· ${x.n} test</span></div><span class="chip ${basariClass(x.basari)}">%${x.basari}</span></div>
        <div class="bar ${x.basari<40?'bad':''}"><i style="width:${Math.max(5,x.basari)}%"></i></div>
      </div>`).join('')+`</div>`;
  }

  // Konu bazında zayıflık
  const agg={};
  yk.forEach(r=>{ if(!r.konular)return; const key=r.konu_id; agg[key]=agg[key]||{ad:r.konular.ad,ders:r.konular.ders_id,n:0}; agg[key].n+=r.adet||1; });
  const klist=Object.values(agg).sort((a,b)=>b.n-a.n);
  if(klist.length){
    const kmax=klist[0].n;
    h+=`<h2 class="sec">Konu bazında zayıflık</h2><div class="card pad">`+
      klist.map(x=>`<div style="margin-top:4px">
        <div class="barrow"><div class="nm">${esc(x.ad)}${analizDers?'':` <span class="tiny">· ${dersAd(x.ders)}</span>`}</div><span class="chip ${x.n>=kmax*0.66?'bad':(x.n>=kmax*0.33?'warn':'')}">${x.n}</span></div>
        <div class="bar ${x.n>=kmax*0.5?'bad':''}"><i style="width:${Math.max(7,x.n/kmax*100)}%"></i></div>
      </div>`).join('')+`</div>`;
  } else if(srows.length){
    h+=`<h2 class="sec">Konu bazında zayıflık</h2><div class="empty" style="padding:14px">Bu kitapların soruları konulara eşlenmediği için konu analizi henüz yok.</div>`;
  }

  body.innerHTML=h;
  if(srows.length){
    window._anRows=srows;
    $$('#an_periods [data-period]').forEach(btn=>btn.onclick=()=>{ analizPeriod=btn.dataset.period; drawAnChart(); });
    drawAnChart();
  }
}

async function renderOdevTests(odev){
  const body=$('#rsBody'); if(!body) return;
  const {data:links}=await db.from('odev_test')
    .select('id,materyal_test_id,materyal_testleri(id,unite,bolum,tip,test_no,konu_id,soru_sayisi,materyal_id)')
    .eq('odev_id',odev.id);
  const rows=(links||[]).filter(l=>l.materyal_testleri);
  const tids=rows.map(r=>r.materyal_test_id);
  const done={};

    const {data}=await db.from('sonuclar').select('id,materyal_test_id,dogru,yanlis,bos,cozum_tarihi')
      .in('materyal_test_id',tids).order('cozum_tarihi',{ascending:false});

  let h=`<h2 class="sec" style="margin-top:4px">Bu ödevin testleri</h2>`;
  if(rows.length){
    h+=`<div class="card" style="padding:2px 0;margin-bottom:10px">`+rows.map(r=>{
      const t=r.materyal_testleri, sols=done[r.materyal_test_id]||[], s=sols[0];
      const st= s? `<span class="chip ok">net ${fnet(s.dogru,s.yanlis)}</span>` : `<span class="chip">çözülmedi</span>`;
      const q=soruStr(t.soru_sayisi);
      let sub='';
      if(sols.length){
        sub=sols.map(so=>{
          const wb=(so.yanlis||0)+(so.bos||0);
          const lbl= wb? `${wb} yanlış/boş · konu işaretle ›` : 'tam ✓';

            <span class="tiny" style="color:var(--ink-2)">${trDate(so.cozum_tarihi)} · net ${fnet(so.dogru,so.yanlis)}</span>
            <span class="chip ${wb?'warn':'ok'}" style="cursor:pointer">${lbl}</span>
          </div>`;
        }).join('');
      }
      return `<div style="border-top:1px solid var(--line)">
        <div class="row" style="justify-content:space-between;gap:8px;padding:9px 13px">
          <div style="flex:1;min-width:0;cursor:pointer" onclick="solveOdevTest(${odev.id},${t.id})">
            <div style="font-weight:650;font-size:13.5px">${esc(testLabel(t))} ›</div>
            ${q?`<div class="tiny">${q}</div>`:''}
          </div>
          ${st}
          ${isVeli()?`<button class="btn sm" title="Çıkar" onclick="unlinkOdevTest(${r.id},${odev.id})" style="padding:4px 9px;color:var(--bad)">✕</button>`:''}
        </div>
        ${sub}
      </div>`;
    }).join('')+`</div>`;
  } else {
    h+=`<p class="hint" style="margin:6px 0 10px">Henüz test eklenmedi. Öğretmenin verdiği sayfalar hangi test(ler)e denk geliyorsa aşağıdan seçip ekle.</p>`;
  }
  h+=`<div class="card" style="padding:12px">
      <div class="tiny" style="margin-bottom:8px;font-weight:700">Test ekle</div>
      <label class="fld" style="margin:0 0 8px"><span class="lab">Kitap</span><select id="ot_mat"></select></label>
      <div class="lab" style="margin:0 0 6px">Testler <span class="tiny" style="font-weight:400">(birden fazla seçebilirsin)</span></div>
      <div id="ot_testler" style="margin:0 0 10px;color:var(--ink-3);font-size:13px">Önce kitap seçin.</div>
      <button class="btn brand block" id="ot_add">+ Seçilenleri ekle</button>
    </div>`;
  body.innerHTML=h;

  // kitap seçenekleri: eşleşen en üstte, gerisi isme göre alfabetik
  const mats=[...Object.values(S.matById)].sort((a,b)=>{
    if(matched){ if(a.id===matched.id)return -1; if(b.id===matched.id)return 1; }
    return a.ad.localeCompare(b.ad,'tr',{numeric:true,sensitivity:'base'});
  });
  const ms=$('#ot_mat'), box=$('#ot_testler');
  ms.innerHTML=`<option value="">— Seçiniz —</option>`+mats.map(m=>`<option value="${m.id}" ${matched&&m.id===matched.id?'selected':''}>${esc(m.ad)} · ${esc(dersAd(m.ders_id))}</option>`).join('');
  const linked=new Set(tids);
  const fillTests=async()=>{
    if(!ms.value){ box.innerHTML='<div style="color:var(--ink-3)">Önce kitap seçin.</div>'; return; }
    const ts=await testsOf(+ms.value);
    if(!ts.length){ box.innerHTML='<div style="color:var(--ink-3)">Bu kitapta test bulunamadı.</div>'; return; }
    box.innerHTML=ts.map(t=>{ const ekli=linked.has(t.id);

    if(error){ toast('Eklenemedi: '+error.message); return; }
    toast(ids.length+' test eklendi'); renderOdevTests(odev);

async function unlinkOdevTest(linkId,odevId){
  if(!isVeli()){ toast('Bu işlem veli girişiyle yapılır'); return; }
  if(!confirm('Bu test ödevden çıkarılsın mı?\n(Çözüm kayıtları silinmez, sadece bu ödevle bağlantısı kaldırılır.)')) return;
  const {error}=await db.from('odev_test').delete().eq('id',linkId);
  if(error){ toast('Çıkarılamadı'); return; }
  toast('Test çıkarıldı');
  const {data}=await db.from('odevler').select('*').eq('id',odevId).single();
  if(data) renderOdevTests(data);
}

    db.from('materyal_testleri').select('*').eq('id',testId).single()
  ]);
  const odev=oR.data, test=tR.data;
  if(!test){ toast('Test bulunamadı'); return; }
  const sd=$('#view-sonuc #k_dyn'); if(sd) sd.innerHTML=''; // Sonuç sekmesiyle ID çakışmasını önle
  sheet(`<button class="btn sm" id="ot_back" style="margin-bottom:8px">‹ Ödeve dön</button>

    <p class="hint">${esc(odev.materyal||dersAd(odev.ders_id))}</p>
    <div id="rs_dyn"></div>`);
  $('#ot_back').onclick=()=>openResultSheet({fromOdev:odev});
  await buildKitapEntry(test, odev.ders_id, $('#rs_dyn'));

async function saveFromOdev(ctx){
  let d,y,b;
  if(ctx.hasCA){({d,y,b}=ctx._dyb||{d:0,y:0,b:0}); if(d+y+b===0){toast('Şıkları işaretle');return;}
    const need=ctx._needQs||[]; if(need.some(n=>!ctx.photos[n.q])){ toast('Önce yanlış/boş soruların fotoğrafını çek'); return; }}
  else {d=+$('#m_d').value||0;y=+$('#m_y').value||0;b=+$('#m_b').value||0;}
  $('#k_save').disabled=true;
  let fotos=[];
  if(ctx.hasCA){ try{ fotos=await uploadPhotos(ctx); }catch(e){ toast('Fotoğraf yüklenemedi, tekrar dene'); $('#k_save').disabled=false; return; } }
  const sRes=await db.from('sonuclar').insert({odev_id:ctx._odev.id,ders_id:ctx.dersId,materyal_test_id:ctx.test.id,dogru:d,yanlis:y,bos:b,cozum_tarihi:$('#k_date').value||todayISO()}).select('id').single();
  if(!sRes.error){ const konu=ctx.hasMSK?(ctx.autoKonu||{}):(ctx.manualKonu||{}); const yk=Object.entries(konu).map(([k,a])=>({sonuc_id:sRes.data.id,konu_id:+k,adet:a})); if(yk.length)await db.from('yanlis_konular').insert(yk);
    if(fotos.length){ const rows=fotos.map(f=>({sonuc_id:sRes.data.id,materyal_test_id:ctx.test.id,soru_no:f.soru_no,tip:f.tip,secilen:(ctx.answers&&ctx.answers[f.soru_no])||null,foto_path:f.foto_path,foto_url:f.foto_url,temiz_path:f.temiz_path,temiz_url:f.temiz_url})); const r=await db.from('yanlis_foto').insert(rows).select('id'); if(r.error)toast('Fotoğraf kaydı yazılamadı'); else vektorleBaslat(r.data); } }
  // Otomatik tescil: ödeve bağlı TÜM testler çözüldüyse ödevi "yapıldı" yap
  const {data:links}=await db.from('odev_test').select('materyal_test_id').eq('odev_id',ctx._odev.id);
  const tids=(links||[]).map(l=>l.materyal_test_id);
  let allDone=tids.length>0;
  if(tids.length){
    const {data:res}=await db.from('sonuclar').select('materyal_test_id').in('materyal_test_id',tids);
    const solved=new Set((res||[]).map(r=>r.materyal_test_id));
    allDone=tids.every(t=>solved.has(t));
  }
  if(allDone) await db.from('odevler').update({durum:'yapildi'}).eq('id',ctx._odev.id);
  await syncOdevDurum(ctx.test.id); // aynı testi içeren diğer ödevleri de kapsa
  closeSheet(); toast(allDone?`Kaydedildi · ödev yapıldı · net ${fnet(d,y)}`:`Kaydedildi · net ${fnet(d,y)}`); renderOdev();
}

/* ---------- ÇÖZÜM DETAYI: cevap anahtarı (salt-okunur) + konu işaretle ---------- */
async function openCozumDetay(sonucId,testId,odevId){
  sheet(`<button class="btn sm" id="cd_back" style="margin-bottom:8px">‹ Ödeve dön</button>
    <div id="cd_dyn"><div class="sk" style="margin-top:12px"></div></div>`);
  const [sR,tR,caR,yfR,mskR]=await Promise.all([
    db.from('sonuclar').select('id,ders_id,dogru,yanlis,bos,net,cozum_tarihi,odev_id,materyal_test_id').eq('id',sonucId).single(),
    db.from('materyal_testleri').select('id,unite,bolum,tip,test_no,konu_id,materyaller(ad,ders_id)').eq('id',testId).single(),
    db.from('cevap_anahtari').select('soru_no,dogru_cevap').eq('materyal_test_id',testId).order('soru_no'),
    db.from('yanlis_foto').select('id,soru_no,tip,konu_id,secilen').eq('sonuc_id',sonucId).order('soru_no'),
    db.from('materyal_soru_konu').select('soru_no,konu_id').eq('materyal_test_id',testId)
  ]);
  const sonuc=sR.data, test=tR.data, CA=caR.data||[], YF=yfR.data||[], MSK=mskR.data||[];
  const dersId=(sonuc&&sonuc.ders_id)|| (test&&test.materyaller&&test.materyaller.ders_id) || null;
  const mskByQ={}; MSK.forEach(m=>{ mskByQ[m.soru_no]=m.konu_id; });
  const yfByQ={}; YF.forEach(f=>{ yfByQ[f.soru_no]=f; });
  // geri dön
  $('#cd_back').onclick=async()=>{ const {data}=await db.from('odevler').select('*').eq('id',odevId).single(); if(data) openResultSheet({fromOdev:data}); else closeSheet(); };

  const ks=S.konByDers[dersId]||[];
  const dyn=$('#cd_dyn');
  if(!CA.length){
    dyn.innerHTML=`<h3>${esc(testLabel(test))}</h3>
      <p class="hint">${esc((test.materyaller||{}).ad||'')}</p>
      <div class="empty" style="margin-top:20px">Bu testin cevap anahtarı yok, soru bazında gösterilemiyor.</div>`;
    return;
  }
  // salt-okunur cevap anahtarı: doğru=yeşil, yanlış=kırmızı, boş=gri (yanlis_foto'ya göre)
  const grid=CA.map(c=>{
    const f=yfByQ[c.soru_no], corr=esc(c.dogru_cevap||'–');
    if(!f) return `<div class="caq ok"><span class="caq-n">${c.soru_no}</span><span class="caq-a">${corr}</span><span class="caq-s">doğru</span></div>`;
    if(f.tip==='bos') return `<div class="caq blank"><span class="caq-n">${c.soru_no}</span><span class="caq-a">–</span><span class="caq-s">boş · d:${corr}</span></div>`;
    const sec=f.secilen?esc(f.secilen):null;
    return `<div class="caq wrong"><span class="caq-n">${c.soru_no}</span><span class="caq-a">${sec||corr}</span><span class="caq-s">${sec?('d:'+corr):'yanlış'}</span></div>`;
  }).join('');

  // konu seçilecek sorular: yanlış + boş (yanlis_foto satırları)
  const marks=YF.slice().sort((a,b)=>a.soru_no-b.soru_no);

async function saveCozumKonu(sonucId,odevId,btn){

    const r=await db.from('yanlis_foto').update({konu_id:kid}).eq('id',yfId);
    if(r.error){ toast('Kaydedilemedi: '+r.error.message); btn.disabled=false; return; }
  }
  // 2) yanlis_konular'ı bu çözüm için yeniden kur (konu bazında sayı)
  const agg={}; sels.forEach(sel=>{ if(sel.value){ const k=+sel.value; agg[k]=(agg[k]||0)+1; } });

  const yk=Object.entries(agg).map(([k,a])=>({sonuc_id:sonucId,konu_id:+k,adet:a}));
  if(yk.length){ const r=await db.from('yanlis_konular').insert(yk); if(r.error){ toast('Konu özeti yazılamadı'); btn.disabled=false; return; } }

  toast('Konular kaydedildi ✓');

}

/* ---------- VEKTÖR EDİTÖRÜ (fabric.js ile çizim + yazı) ---------- */
let _fabricP=null;
function ensureFabric(){
  if(window.fabric) return Promise.resolve();
  if(_fabricP) return _fabricP;
  _fabricP=new Promise((res,rej)=>{
    const add=(src,next)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>res(); s.onerror=next; document.head.appendChild(s); };
    add('https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js',
      ()=>add('https://unpkg.com/fabric@5.3.0/dist/fabric.min.js',
        ()=>rej(new Error('fabric yüklenemedi'))));
  });
  return _fabricP;
}
let VEK=null;
async function openVektorEditor(fotoId,onClose){
  try{ await ensureFabric(); }catch(e){ toast('Editör yüklenemedi (internet?)'); return; }
  const {data:row,error}=await db.from('yanlis_foto')
    .select('id,materyal_test_id,soru_no,tip,foto_url,temiz_url,vektor_url,vektor_path').eq('id',fotoId).single();
  if(error||!row){ toast('Soru bulunamadı'); return; }
  const ed=$('#vekEditor'); ed.classList.add('open'); ed.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
  $('#vekTitle').textContent=`Soru ${row.soru_no} · ${row.tip==='bos'?'boş':'yanlış'} — vektör düzenle`;
  const ref=$('#vekRef'); ref.classList.remove('show'); const refSrc=row.foto_url||row.temiz_url;
  ref.innerHTML = refSrc?`<img src="${esc(refSrc)}" alt="orijinal"><button class="ref-rot" id="vekRot" title="Orijinali döndür">⟳</button><span class="refhint">Tekerlek: yakınlaştır · sürükle: kaydır · ⟳ döndür</span>`:'';
  let W=900,H=600, svg=null;
  if(row.vektor_url){ try{ svg=await fetch(row.vektor_url.split('?')[0]+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.text()); }catch(_){ } }
  if(svg){ const vb=(svg.match(/viewBox="([-\d.\s]+)"/)||[])[1]; if(vb){ const p=vb.trim().split(/\s+/).map(Number); if(p.length===4&&p[2]>0&&p[3]>0){ W=p[2]; H=p[3]; } } }
  // Kayıpsız düzenleme için fabric JSON (varsa) — SVG tur-döngüsü metni/üssü bozuyor
  const jsonPath = row.vektor_path ? row.vektor_path.replace(/\.svg$/,'.json') : `${row.materyal_test_id}/${row.id}_vektor.json`;
  let fjson=null;
  try{ const ju=db.storage.from('yanlis-foto').getPublicUrl(jsonPath).data.publicUrl; const jr=await fetch(ju+'?v='+Date.now(),{cache:'no-store'}); if(jr.ok){ const txt=await jr.text(); if(txt && txt.trim()[0]==='{'){ fjson=JSON.parse(txt); } } }catch(_){ }
  if(VEK&&VEK.canvas){ try{VEK.canvas.dispose();}catch(_){ } }
  const canvas=new fabric.Canvas('vekCanvas',{backgroundColor:'#ffffff',preserveObjectStacking:true});
  VEK={canvas,row,W,H,jsonPath,mode:'select',color:'#1b2440',width:2,font:20,history:[],_loading:false,_onClose:onClose||null};
  vekFit();
  bindVekCanvas(canvas);
  if(fjson){
    VEK._loading=true;
    canvas.loadFromJSON(fjson,()=>{ canvas.forEachObject(o=>{ o.selectable=true; o.evented=true; }); canvas.requestRenderAll(); VEK._loading=false; vekPush(); });
  } else if(svg){
    VEK._loading=true;
    fabric.loadSVGFromString(svg,(objs)=>{
      let pending=objs.length||0; if(!pending){ VEK._loading=false; vekPush(); }
      const done=()=>{ if(--pending<=0){ canvas.requestRenderAll(); VEK._loading=false; vekPush(); } };
      objs.forEach(o=>{
        if(o && o.type==='text'){
          const ob=o.toObject(['styles']); ob.type='i-text';
          fabric.IText.fromObject(ob,(it)=>{ it.selectable=true; it.evented=true; canvas.add(it); done(); });
        } else { if(o){ o.selectable=true; o.evented=true; canvas.add(o); } done(); }
      });
    });
  } else { vekPush(); }
  wireVekTools();
}
function vekFit(){
  if(!VEK) return; const stage=$('#vekStage'); const sw=Math.max(200,stage.clientWidth), sh=Math.max(200,stage.clientHeight);
  const c=VEK.canvas; c.setWidth(sw); c.setHeight(sh);
  const z=Math.min(sw/VEK.W, sh/VEK.H)*0.96;
  c.setViewportTransform([z,0,0,z,(sw-VEK.W*z)/2,(sh-VEK.H*z)/2]); c.requestRenderAll();
}
function bindVekCanvas(c){
  let draft=null, start=null, panning=false, lpx=0, lpy=0;
  c.on('mouse:wheel',opt=>{ const e=opt.e; e.preventDefault(); e.stopPropagation();
    let z=c.getZoom()*Math.pow(0.999,e.deltaY); z=Math.min(10,Math.max(0.1,z));
    c.zoomToPoint({x:e.offsetX,y:e.offsetY}, z); });
  c.on('mouse:down',opt=>{
    if(opt.e.button===1){ panning=true; lpx=opt.e.clientX; lpy=opt.e.clientY; c.setCursor('grabbing'); opt.e.preventDefault(); return; }
    if(VEK.mode==='select'||VEK.mode==='draw') return;
    const p=c.getPointer(opt.e); start=p;
    if(VEK.mode==='text'){
      const t=new fabric.IText('Yazı',{left:p.x,top:p.y,fontSize:VEK.font,fill:VEK.color,fontFamily:'Arial'});
      c.add(t); c.setActiveObject(t); t.enterEditing(); if(t.selectAll)t.selectAll(); vekSetMode('select'); vekPush(); return;
    }
    if(VEK.mode==='rect') draft=new fabric.Rect({left:p.x,top:p.y,width:1,height:1,fill:'',stroke:VEK.color,strokeWidth:VEK.width});
    else if(VEK.mode==='ellipse') draft=new fabric.Ellipse({left:p.x,top:p.y,rx:1,ry:1,fill:'',stroke:VEK.color,strokeWidth:VEK.width});
    else if(VEK.mode==='line') draft=new fabric.Line([p.x,p.y,p.x,p.y],{stroke:VEK.color,strokeWidth:VEK.width});
    if(draft) c.add(draft);
  });
  c.on('mouse:move',opt=>{
    if(panning){ const e=opt.e; const vpt=c.viewportTransform; vpt[4]+=e.clientX-lpx; vpt[5]+=e.clientY-lpy; lpx=e.clientX; lpy=e.clientY; c.setViewportTransform(vpt); return; }
    if(!draft||!start) return; const p=c.getPointer(opt.e);
    if(VEK.mode==='rect') draft.set({left:Math.min(p.x,start.x),top:Math.min(p.y,start.y),width:Math.abs(p.x-start.x),height:Math.abs(p.y-start.y)});
    else if(VEK.mode==='ellipse') draft.set({left:Math.min(p.x,start.x),top:Math.min(p.y,start.y),rx:Math.abs(p.x-start.x)/2,ry:Math.abs(p.y-start.y)/2});
    else if(VEK.mode==='line') draft.set({x2:p.x,y2:p.y});
    c.requestRenderAll();
  });
  c.on('mouse:up',()=>{ if(panning){ panning=false; c.setCursor('default'); return; } if(draft){ draft.setCoords(); draft=null; start=null; vekSetMode('select'); vekPush(); } });
  c.on('path:created',()=>vekPush());
  c.on('object:modified',()=>vekPush());
}
function vekSetMode(m){
  if(!VEK) return; VEK.mode=m; const c=VEK.canvas;
  c.isDrawingMode=(m==='draw');
  if(m==='draw'&&c.freeDrawingBrush){ c.freeDrawingBrush.color=VEK.color; c.freeDrawingBrush.width=VEK.width; }
  c.selection=(m==='select');
  c.forEachObject(o=>{ o.selectable=(m==='select'); o.evented=(m==='select'); });
  if(m!=='select') c.discardActiveObject();
  c.requestRenderAll();
  $$('#vekTools [data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
}
function vekPush(){ if(!VEK||VEK._loading) return; try{ VEK.history.push(JSON.stringify(VEK.canvas.toJSON())); if(VEK.history.length>40)VEK.history.shift(); }catch(_){ } }
function vekUndo(){ if(!VEK||VEK.history.length<2) return; VEK.history.pop(); const st=VEK.history[VEK.history.length-1]; VEK._loading=true; VEK.canvas.loadFromJSON(st,()=>{ VEK.canvas.requestRenderAll(); VEK._loading=false; vekSetMode('select'); }); }
function vekDel(){ if(!VEK) return; const c=VEK.canvas; const objs=c.getActiveObjects(); if(!objs.length) return; objs.forEach(o=>c.remove(o)); c.discardActiveObject(); c.requestRenderAll(); vekPush(); }
function vekPlace(c,cl){ cl.set({left:(cl.left||0)+18,top:(cl.top||0)+18,evented:true,selectable:true}); c.discardActiveObject();
  if(cl.type==='activeSelection'){ cl.canvas=c; cl.forEachObject(o=>{o.selectable=true;o.evented=true;c.add(o);}); cl.setCoords(); } else { c.add(cl); }
  c.setActiveObject(cl); c.requestRenderAll(); vekPush(); }
function vekDup(){ if(!VEK) return; if(VEK.mode!=='select')vekSetMode('select'); const c=VEK.canvas; const act=c.getActiveObject(); if(!act){ toast('Önce bir şekil seç'); return; } act.clone(cl=>vekPlace(c,cl)); }
function vekCopy(){ if(!VEK) return; const act=VEK.canvas.getActiveObject(); if(!act){ toast('Önce bir şekil seç'); return; } act.clone(cl=>{ VEK._clip=cl; toast('Kopyalandı · Yapıştır (Ctrl+V)'); }); }
function vekPaste(){ if(!VEK||!VEK._clip){ toast('Önce kopyala (Ctrl+C)'); return; } if(VEK.mode!=='select')vekSetMode('select'); VEK._clip.clone(cl=>vekPlace(VEK.canvas,cl)); }
function vekSetColor(v){ if(!VEK) return; VEK.color=v; const c=VEK.canvas; const o=c.getActiveObject(); if(o){ if(o.type==='i-text'||o.type==='text')o.set('fill',v); else o.set('stroke',v); c.requestRenderAll(); vekPush(); } if(c.freeDrawingBrush)c.freeDrawingBrush.color=v; }
function vekSetWidth(w){ if(!VEK) return; VEK.width=+w; const c=VEK.canvas; const o=c.getActiveObject(); if(o&&o.type!=='i-text'&&o.type!=='text'&&o.strokeWidth!=null){ o.set('strokeWidth',+w); c.requestRenderAll(); vekPush(); } if(c.freeDrawingBrush)c.freeDrawingBrush.width=+w; }
function vekSetFont(s){ if(!VEK) return; VEK.font=+s; const o=VEK.canvas.getActiveObject(); if(o&&(o.type==='i-text'||o.type==='text')){ o.set('fontSize',+s); VEK.canvas.requestRenderAll(); vekPush(); } }
function vekScript(up){
  if(!VEK) return; const c=VEK.canvas; const o=c.getActiveObject();
  if(!o || (o.type!=='i-text'&&o.type!=='text')){ toast('Önce yazıya çift tıkla, üs/indis yapılacak karakteri seç'); return; }
  const s=o.selectionStart, e=o.selectionEnd;
  if(s==null||e==null||s===e){ toast('Üs/indis yapılacak karakter(ler)i seç'); return; }
  const base=o.fontSize||20;
  o.setSelectionStyles({ fontSize: Math.max(8,Math.round(base*0.65)), deltaY: up? -Math.round(base*0.33) : Math.round(base*0.22) }, s, e);
  c.requestRenderAll(); vekPush();
}
function vekToggleRef(){ const r=$('#vekRef'); if(!r.innerHTML){ toast('Orijinal fotoğraf yok'); return; }
  const show=!r.classList.contains('show'); r.classList.toggle('show',show);
  requestAnimationFrame(()=>{ vekFit(); if(show) setupRefZoom(); });
}
function setupRefZoom(){
  const wrap=$('#vekRef'); const img=wrap.querySelector('img'); if(!img) return;
  let sc=1,tx=0,ty=0,rot=0,pan=false,lx=0,ly=0;
  const dims=()=>{ const nw=img.naturalWidth||wrap.clientWidth||300, nh=img.naturalHeight||wrap.clientHeight||300;
    return (rot%180)? {nw,nh,enw:nh,enh:nw} : {nw,nh,enw:nw,enh:nh}; };
  const apply=()=>{ const {nw,nh}=dims(); let off='0px,0px';
    if(rot===90) off=`${nh}px,0px`; else if(rot===180) off=`${nw}px,${nh}px`; else if(rot===270) off=`0px,${nw}px`;
    img.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${sc}) translate(${off}) rotate(${rot}deg)`; };
  const fit=()=>{ const ww=wrap.clientWidth||300, wh=wrap.clientHeight||300; const {enw,enh}=dims();
    sc=Math.max(0.05, Math.min(ww/enw, wh/enh)); tx=(ww-enw*sc)/2; ty=(wh-enh*sc)/2; apply(); };
  if(img.complete && img.naturalWidth) fit(); else img.onload=fit;
  // önceki dinleyicileri temizle
  if(wrap._wheel) wrap.removeEventListener('wheel',wrap._wheel);
  if(wrap._mm) window.removeEventListener('mousemove',wrap._mm);
  if(wrap._mu) window.removeEventListener('mouseup',wrap._mu);
  wrap._wheel=e=>{ e.preventDefault(); const rect=wrap.getBoundingClientRect(); const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const cx=(px-tx)/sc, cy=(py-ty)/sc; sc=Math.min(12,Math.max(0.05, sc*Math.pow(0.999,e.deltaY))); tx=px-cx*sc; ty=py-cy*sc; apply(); };
  wrap.addEventListener('wheel',wrap._wheel,{passive:false});
  wrap.onmousedown=e=>{ if(e.target.closest('.ref-rot')) return; pan=true; lx=e.clientX; ly=e.clientY; img.style.cursor='grabbing'; e.preventDefault(); };
  wrap._mm=e=>{ if(!pan)return; tx+=e.clientX-lx; ty+=e.clientY-ly; lx=e.clientX; ly=e.clientY; apply(); };
  wrap._mu=()=>{ if(pan){ pan=false; img.style.cursor='grab'; } };
  window.addEventListener('mousemove',wrap._mm); window.addEventListener('mouseup',wrap._mu);
  const rb=$('#vekRot'); if(rb) rb.onclick=(e)=>{ e.stopPropagation(); rot=(rot+90)%360; fit(); };
}
async function saveVektorEdit(){
  if(!VEK) return; const c=VEK.canvas, row=VEK.row; const btn=$('#vekSave');
  let svg; try{ svg=c.toSVG({width:VEK.W,height:VEK.H,viewBox:{x:0,y:0,width:VEK.W,height:VEK.H}}); }catch(e){ toast('SVG üretilemedi'); return; }

  const pub=db.storage.from('yanlis-foto').getPublicUrl(path).data.publicUrl;
  const r=await db.from('yanlis_foto').update({vektor_path:path,vektor_url:pub+'?t='+Date.now(),vektor_durum:'hazir',vektor_onayli:true,vektor_hata:null}).eq('id',row.id);

function closeVektorEditor(){ const cb=VEK&&VEK._onClose; const ed=$('#vekEditor'); ed.classList.remove('open'); ed.setAttribute('aria-hidden','true'); document.body.style.overflow='';
  const wrap=$('#vekRef'); if(wrap){ if(wrap._mm)window.removeEventListener('mousemove',wrap._mm); if(wrap._mu)window.removeEventListener('mouseup',wrap._mu); if(wrap._wheel)wrap.removeEventListener('wheel',wrap._wheel); wrap._mm=wrap._mu=wrap._wheel=null; wrap.classList.remove('show'); }
  if(VEK&&VEK.canvas){ try{VEK.canvas.dispose();}catch(_){ } } VEK=null; if(cb){ try{cb();}catch(_){ } } }
function wireVekTools(){
  $$('#vekTools [data-mode]').forEach(b=> b.onclick=()=>vekSetMode(b.dataset.mode));
  const col=$('#vekColor'); col.value=VEK.color; col.oninput=e=>vekSetColor(e.target.value);

  $('#vekSub').onmousedown=e=>{ e.preventDefault(); vekScript(false); };
  $('#vekDup').onclick=vekDup;
  $('#vekDel').onclick=vekDel;
  $('#vekUndo').onclick=vekUndo;
  $('#vekRefBtn').onclick=vekToggleRef;
  $('#vekSave').onclick=saveVektorEdit;
  $('#vekClose').onclick=()=>{ if(confirm('Kaydetmeden çıkılsın mı?')) closeVektorEditor(); };
  vekSetMode('select');
}
window.addEventListener('resize',()=>{ if(VEK&&$('#vekEditor').classList.contains('open')) vekFit(); });
window.addEventListener('keydown',e=>{
  if(!VEK||!$('#vekEditor').classList.contains('open'))return;
  const a=VEK.canvas.getActiveObject(); if(a&&a.isEditing) return; // metin yazarken kısayollara karışma
  const mod=e.ctrlKey||e.metaKey;
  if((e.key==='Delete'||e.key==='Backspace')&&a){ e.preventDefault(); vekDel(); return; }
  if(mod&&(e.key==='d'||e.key==='D')){ e.preventDefault(); vekDup(); return; }
  if(mod&&(e.key==='c'||e.key==='C')){ e.preventDefault(); vekCopy(); return; }
  if(mod&&(e.key==='v'||e.key==='V')){ e.preventDefault(); vekPaste(); return; }
});
