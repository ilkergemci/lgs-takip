<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LGS Takip</title>
<meta name="description" content="Oğlumun LGS hazırlığı için ödev ve deneme takip paneli">
<style>
  :root{
    --bg:#f3f5fb; --surface:#ffffff; --surface-2:#f7f9ff; --line:#e4e8f3;
    --ink:#1b2440; --ink-2:#5b6686; --ink-3:#8b93ad;
    --brand:#4f46e5; --brand-ink:#ffffff; --brand-soft:#ecebfd;
    --ok:#16a34a; --ok-soft:#e3f7ea; --warn:#d97706; --warn-soft:#fdf0db;
    --bad:#dc2626; --bad-soft:#fdeaea; --info:#0ea5e9;
    --shadow:0 1px 2px rgba(27,36,64,.06),0 8px 24px rgba(27,36,64,.07);
    --r:16px; --r-sm:11px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1222; --surface:#171c30; --surface-2:#1e243c; --line:#2a3150;
      --ink:#eef1fb; --ink-2:#aab3d1; --ink-3:#7b84a4;
      --brand:#8b84ff; --brand-ink:#141425; --brand-soft:#241f49;
      --ok:#4ade80; --ok-soft:#14321f; --warn:#fbbf24; --warn-soft:#3a2c0e;
      --bad:#f87171; --bad-soft:#3a1618; --info:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
      --bg:#0e1222; --surface:#171c30; --surface-2:#1e243c; --line:#2a3150;
      --ink:#eef1fb; --ink-2:#aab3d1; --ink-3:#7b84a4;
      --brand:#8b84ff; --brand-ink:#141425; --brand-soft:#241f49;
      --ok:#4ade80; --ok-soft:#14321f; --warn:#fbbf24; --warn-soft:#3a2c0e;
      --bad:#f87171; --bad-soft:#3a1618; --info:#38bdf8;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  a{color:var(--brand)}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
  header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#7c74ff);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
  .top h1{font-size:17px;margin:0;font-weight:750;letter-spacing:-.2px}
  .top .sub{font-size:12px;color:var(--ink-3);margin-top:1px}
  .spacer{flex:1}
  .icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;font-size:16px}
  .icon-btn:active{transform:scale(.95)}

  h2.sec{font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-3);margin:22px 4px 10px;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .stat .l{font-size:12px;color:var(--ink-3);margin-top:6px;font-weight:600}
  .muted{color:var(--ink-3)}
  .row{display:flex;align-items:center;gap:10px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 15px;border-radius:12px;font-size:14.5px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:active{transform:scale(.98)}
  .btn.brand{background:var(--brand);color:var(--brand-ink);border-color:transparent}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
  .btn.block{width:100%}
  .btn.ok{background:var(--ok);color:#fff;border-color:transparent}
  .btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
  .chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
  .chip.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
  label.fld{display:block;margin:12px 0 0}
  label.fld .lab{font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px;display:block}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink);font-size:15px;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:0;border-color:var(--brand)}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:none;background:transparent;color:var(--ink-2);padding:9px;border-radius:9px;font-weight:650;font-size:13.5px;cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .list>*+*{margin-top:10px}
  .item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .item .t{font-weight:680;font-size:14.5px}
  .item .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .barrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}
  .barrow .nm{font-size:13.5px;font-weight:600}
  .bar{height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#7c74ff)}
  .bar.bad>i{background:linear-gradient(90deg,#f0795a,var(--bad))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .tab{border:none;background:transparent;color:var(--ink-3);padding:7px 4px;border-radius:12px;font-size:11px;font-weight:650;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .tab svg{width:22px;height:22px}
  .tab.on{color:var(--brand)}
  .fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--brand-ink);border:none;box-shadow:0 8px 24px color-mix(in srgb,var(--brand) 45%,transparent);font-size:26px;cursor:pointer;display:grid;place-items:center}
  .sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,14,28,.5);backdrop-filter:blur(2px);display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.open{display:flex}
  .sheet{position:relative;background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:52px 16px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:none}
  .grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:8px auto 10px}
  .sheet-close{position:absolute;top:12px;left:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font-size:18px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center}
  .sheet-close:active{background:var(--line)}
  .sheet .grab{position:absolute;top:9px;left:50%;transform:translateX(-50%);margin:0}
  .sheet h3{margin:4px 2px 2px;font-size:19px;font-weight:760;letter-spacing:-.3px}
  .sheet .hint{font-size:13px;color:var(--ink-3);margin:0 2px 8px}
  /* Optik cevap formu — sınav kapısı tonu (pembe-kahve) */
  .optik-wrap{--opk-line:#c98f7c;--opk-ink:#9c5742;--opk-head:#f6e6de;--okg:#1f9d3f;--kor:#d83b3b;border:2px solid var(--opk-line);border-radius:12px;overflow:hidden;margin-top:10px;background:var(--surface)}
  .optik-head{background:var(--opk-head);text-align:center;font-weight:800;font-size:12px;letter-spacing:.18em;padding:9px;border-bottom:2px solid var(--opk-line);color:var(--opk-ink)}
  .answers{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:440px){ .answers{grid-template-columns:1fr 1fr} .answers .acell:nth-child(odd){border-right:2px solid var(--opk-line)} }
  .acell{display:flex;align-items:center;gap:9px;padding:7px 11px;border-bottom:1.5px solid var(--opk-line)}
  .acell .qn{width:24px;text-align:center;font-weight:800;font-size:13px;color:var(--opk-ink);flex:none}
  .acell .opts{display:flex;gap:11px;flex:1;justify-content:flex-start}
  .acell .opts b{width:30px;height:30px;line-height:26px;text-align:center;border:2px solid var(--opk-line);border-radius:50%;font-size:12px;font-weight:700;color:var(--opk-ink);cursor:pointer;background:var(--surface);transition:background .1s,box-shadow .1s,color .1s;-webkit-tap-highlight-color:transparent}
  /* öğrenci işareti — sınav sürerken kutunun içi dolu */
  .acell .opts b.marked{background:var(--opk-ink);border-color:var(--opk-ink);color:#fff}
  /* kontrol sonrası */
  .acell .opts b.ringok{box-shadow:0 0 0 3px var(--okg)}                                  /* doğru işaret → kalın yeşil halka */
  .acell .opts b.ringko{box-shadow:0 0 0 3px var(--kor)}                                  /* yanlış işaret → kalın kırmızı halka */
  .acell .opts b.fillok{background:var(--okg);border-color:var(--okg);color:#fff}         /* doğru şıkkın içi yeşil dolu */
  .answers.locked .opts b{cursor:default}                                                /* kontrol sonrası form kilitli */
  .acell .cam-btn{flex:none;width:34px;height:30px;border:2px solid var(--kor);background:var(--surface);color:var(--kor);border-radius:8px;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .acell .cam-btn.done{border-color:var(--okg);background:var(--okg);color:#fff}
  .acell.needphoto{background:color-mix(in srgb, var(--kor) 7%, transparent)}
  .photostat{margin-top:10px;font-size:13px;font-weight:650;color:var(--kor);background:color-mix(in srgb, var(--kor) 10%, transparent);border:1px solid color-mix(in srgb,var(--kor) 35%,transparent);border-radius:10px;padding:9px 12px}
  .photostat.ok{color:var(--okg);background:color-mix(in srgb,var(--okg) 12%,transparent);border-color:color-mix(in srgb,var(--okg) 35%,transparent)}
  .photo-thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .photo-thumbs a{display:block;width:46px;height:46px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative}
  .photo-thumbs a img{width:100%;height:100%;object-fit:cover}
  .photo-thumbs a span{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:9px;padding:1px 3px;border-top-right-radius:5px}
  details > summary{list-style:none} details > summary::-webkit-details-marker{display:none}
  .konu-pick{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px;margin-top:6px}
  .kline{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px}
  .kline:nth-child(odd){background:var(--surface-2)}
  .kline .kn{flex:1;font-size:13.5px}
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;font-weight:700;cursor:pointer;line-height:1}
  .step span{min-width:18px;text-align:center;font-weight:700;font-size:14px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--ink-3);padding:30px 10px;font-size:14px}
  .gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
  .gate .box{width:100%;max-width:320px;text-align:center}
  .pin{letter-spacing:10px;text-align:center;font-size:24px;font-weight:800}
  .tiny{font-size:11.5px;color:var(--ink-3)}
  .split{display:flex;gap:8px}.split>*{flex:1}
  .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--brand-soft);color:var(--brand)}
  .net-big{font-size:30px;font-weight:850;letter-spacing:-1px}
  .hidden{display:none!important}
  .sk{height:70px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <div class="logo" style="margin:0 auto 14px;width:52px;height:52px;border-radius:16px;font-size:22px">LGS</div>
    <h1 style="margin:0 0 4px;font-size:22px">LGS Takip</h1>
    <p class="muted" style="margin:0 0 18px;font-size:14px">Devam etmek için PIN gir</p>
    <input id="pinInput" class="pin" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
    <button class="btn brand block" style="margin-top:14px" id="pinBtn">Giriş</button>
    <p class="tiny" id="pinErr" style="margin-top:10px;color:var(--bad);visibility:hidden">Hatalı PIN</p>
  </div>
</div>

<header class="top hidden" id="appTop">
  <div class="top-in">
    <button class="icon-btn" id="homeBtn" title="Ana menü" style="margin-right:4px;font-size:18px">⌂</button>
    <div>
      <h1 id="viewTitle">Özet</h1>
      <div class="sub" id="viewSub">Genel durum</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="refreshBtn" title="Yenile">⟳</button>
    <button class="icon-btn" id="themeBtn" title="Tema">◐</button>
  </div>
</header>

<main class="wrap hidden" id="app">
  <section id="view-ozet"></section>
  <section id="view-kitap" class="hidden"></section>
  <section id="view-odev" class="hidden"></section>
  <section id="view-sonuc" class="hidden"></section>
  <section id="view-analiz" class="hidden"></section>
</main>

<button class="fab hidden" id="fab" title="Sonuç gir">＋</button>

<nav class="tabs hidden" id="nav">
  <div class="tabs-in">
    <button class="tab on" data-v="ozet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Özet</button>
    <button class="tab" data-v="kitap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg>Kitaplar</button>
    <button class="tab" data-v="odev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Ödevler</button>
    <button class="tab" data-v="sonuc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Sonuç</button>
    <button class="tab" data-v="analiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Analiz</button>
  </div>
</nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
<script>/* CDN yedeği: jsdelivr yüklenmezse unpkg'den dene */
if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"><\/script>');}</script>
<script>
/* ---------- CONFIG ---------- */
const SB_URL = "https://gplfwgtegmxdsemsiszf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwbGZ3Z3RlZ214ZHNlbXNpc3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MzAxMTUsImV4cCI6MjEwOTEwNjExNX0.aa4slgeXqrFvK9zvo0NAECiHmUkg_fjlepCk00gdPaQ";
const APP_PIN = "2026"; // İsterseniz bu satırı değiştirin
if(!window.supabase || !window.supabase.createClient){
  document.body.innerHTML='<div style="padding:46px 24px;max-width:420px;margin:40px auto;text-align:center;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#444">'
    +'<div style="font-size:40px">📶</div><h2 style="margin:12px 0 6px">Sayfa yüklenemedi</h2>'
    +'<p style="color:#777;font-size:14px;line-height:1.5">Bağlantı kütüphanesi indirilemedi. İnternet/VPN bağlantını kontrol edip sayfayı yenile.</p>'
    +'<button onclick="location.reload()" style="margin-top:14px;padding:11px 22px;font-size:15px;border:none;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;cursor:pointer">Yenile</button></div>';
  throw new Error('supabase kütüphanesi yüklenemedi');
}
const { createClient } = window.supabase;
const db = createClient(SB_URL, SB_KEY);

/* ---------- STATE ---------- */
const S = {
  dersler:[], konby:{}, konByDers:{}, matByDers:{}, matById:{},
  view:"ozet"
};
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const net = (d,y)=> (Number(d||0) - Number(y||0)/3);
const fnet = (d,y)=> net(d,y).toFixed(2).replace('.',',');
const todayISO = ()=> new Date().toISOString().slice(0,10);
const trDate = iso => { if(!iso) return "—"; const [y,m,d]=iso.split('-'); return `${d}.${m}.${y.slice(2)}`; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- GATE ---------- */
function openGate(){
  const g=$('#gate'), inp=$('#pinInput');
  if(sessionStorage.getItem('lgs_ok')==='1'){ g.style.display='none'; startApp(); return; }
  g.style.display='grid';
  const tryPin=()=>{ if(inp.value===APP_PIN){ sessionStorage.setItem('lgs_ok','1'); g.style.display='none'; startApp(); } else { $('#pinErr').style.visibility='visible'; inp.value=''; } };
  $('#pinBtn').onclick=tryPin;
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPin(); $('#pinErr').style.visibility='hidden'; };
  inp.focus();
}

/* ---------- THEME ---------- */
(function initTheme(){ const t=localStorage.getItem('lgs_theme'); if(t) document.documentElement.setAttribute('data-theme',t); })();
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next=dark?'light':'dark';
  document.documentElement.setAttribute('data-theme',next); localStorage.setItem('lgs_theme',next);
}

/* ---------- DATA LOAD ---------- */
async function loadCatalog(){
  const [dr, ko, ma] = await Promise.all([
    db.from('dersler').select('*').order('sira'),
    db.from('konular').select('id,ders_id,ad,unite,sira').order('sira'),
    db.from('materyaller').select('id,ad,yayin,ders_id,tur').order('ad')
  ]);
  if(dr.error||ko.error||ma.error){ throw (dr.error||ko.error||ma.error); }
  S.dersler = dr.data;
  S.konby={}; S.konByDers={};
  ko.data.forEach(k=>{ S.konby[k.id]=k; (S.konByDers[k.ders_id]=S.konByDers[k.ders_id]||[]).push(k); });
  S.matByDers={}; S.matById={};
  ma.data.forEach(m=>{ S.matById[m.id]=m; (S.matByDers[m.ders_id]=S.matByDers[m.ders_id]||[]).push(m); });
}
const dersAd = id => (S.dersler.find(d=>d.id==id)||{}).ad || "—";

async function testsOf(materyalId){
  const {data,error}=await db.from('materyal_testleri').select('id,unite,bolum,tip,test_no,konu_id,soru_sayisi').eq('materyal_id',materyalId).order('test_no');
  if(error){toast('Testler yüklenemedi');return[];}
  return data;
}
function testLabel(t){
  let s = t.unite || '';
  if(t.test_no!=null){ const b=(t.bolum && t.bolum!=='Test')? t.bolum : 'Test'; s += (s?' · ':'')+b+' '+t.test_no; }
  return s || ('Test #'+t.id);
}
function soruStr(n){ return (n!=null && +n>0)? (+n)+' soru' : ''; }
function testOpt(t){ const q=soruStr(t.soru_sayisi); return esc(testLabel(t))+(q?' ('+q+')':''); }

const TITLES={ozet:['Özet','Genel durum'],kitap:['Kitaplar','Kitap bazında ilerleme'],odev:['Ödevler','Okul & dershane ödevleri'],sonuc:['Sonuç Gir','Test & deneme sonuçları'],analiz:['Analiz','Konu bazında zayıflık']};
function setView(v){
  S.view=v;

/* ----- ÖZET ----- */
async function renderOzet(){
  const el=$('#view-ozet');
  el.innerHTML=`<div style="margin-top:16px" class="grid3">
      <div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;
  const [odevR, sonR, ykR] = await Promise.all([
    db.from('odevler').select('id,durum,teslim_tarihi,baslik,ders_id,kaynak,materyal').order('teslim_tarihi',{nullsFirst:false}),
    db.from('sonuclar').select('id,dogru,yanlis,bos,net,cozum_tarihi,deneme_id,odev_id,ders_id,denemeler(ad,tarih)').order('cozum_tarihi',{ascending:false}).limit(60),
    db.from('yanlis_konular').select('konu_id,adet')
  ]);
  const odev=odevR.data||[], son=sonR.data||[], yk=ykR.data||[];
  const today=todayISO();
  const notDone=odev.filter(o=>o.durum!=='yapildi');
  const gecikti=notDone.filter(o=>o.teslim_tarihi && o.teslim_tarihi<today);   // teslim geçmiş
  const bekle=notDone.filter(o=>!(o.teslim_tarihi && o.teslim_tarihi<today));  // veriliş–teslim arası (aktif)
  const haftaBasi=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const buHafta=son.filter(s=>s.cozum_tarihi>=haftaBasi).length;
  // weak topics
  const agg={}; yk.forEach(r=>{ agg[r.konu_id]=(agg[r.konu_id]||0)+(r.adet||1); });
  const weak=Object.entries(agg).map(([id,n])=>({k:S.konby[id],n})).filter(x=>x.k).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxW=weak.length?weak[0].n:1;
  // recent denemeler (group by deneme)
  const denMap={};
  son.filter(s=>s.deneme_id).forEach(s=>{ const d=denMap[s.deneme_id]=denMap[s.deneme_id]||{ad:s.denemeler?.ad||'Deneme',tarih:s.denemeler?.tarih,net:0}; d.net+=net(s.dogru,s.yanlis); });
  const dens=Object.values(denMap).sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||'')).slice(0,5);

  el.innerHTML = `
    <div class="grid3" style="margin-top:16px">
      <div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="goOdev('bekliyor')"><div class="n">${bekle.length}</div><div class="l">Bekleyen ödev ›</div></div>
      <div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="goOdev('geciken')"><div class="n" style="color:var(--${gecikti.length?'bad':'ink'})">${gecikti.length}</div><div class="l">Geciken ›</div></div>
      <div class="stat" role="button" tabindex="0" style="cursor:pointer" onclick="goOdev('yapildi')"><div class="n">${buHafta}</div><div class="l">Bu hafta çözülen ›</div></div>
    </div>

    <h2 class="sec">En zayıf konular</h2>
    <div class="card pad" ${weak.length?'role="button" tabindex="0" style="cursor:pointer" onclick="setView(\'analiz\')"':''}>
      ${weak.length? weak.map(w=>`
        <div style="margin-top:2px">
          <div class="barrow"><div class="nm">${esc(w.k.ad)} <span class="tiny">· ${dersAd(w.k.ders_id)}</span></div><span class="chip bad">${w.n} yanlış</span></div>
          <div class="bar bad"><i style="width:${Math.max(8,w.n/maxW*100)}%"></i></div>
        </div>`).join('') : `<div class="empty">Henüz yanlış konu verisi yok.<br>Sonuç girdikçe burada en çok zorlandığı konular çıkacak.</div>`}
    </div>

    <h2 class="sec">Son denemeler</h2>
    <div class="list">
      ${dens.length? dens.map(d=>`
        <div class="item"><div class="dot" style="background:var(--brand)"></div>
          <div style="flex:1"><div class="t">${esc(d.ad)}</div><div class="d">${trDate(d.tarih)}</div></div>
          <div class="net-big" style="font-size:20px">${d.net.toFixed(2).replace('.',',')}<span class="tiny"> net</span></div>
        </div>`).join('') : `<div class="empty">Henüz deneme sonucu girilmedi.</div>`}
    </div>

    <h2 class="sec">Hızlı işlem</h2>
    <div class="split">
      <button class="btn brand" onclick="openOdevForm()">＋ Ödev ekle</button>
      <button class="btn" onclick="setView('sonuc')">＋ Sonuç gir</button>
    </div>`;
}

let odevFilter='bekliyor';
function goOdev(f){ odevFilter=f||'bekliyor'; setView('odev'); }
async function renderOdev(){
  const el=$('#view-odev');
  el.innerHTML=`<div style="margin-top:16px" class="seg" id="ofSeg">
      <button data-f="geciken" class="${odevFilter==='geciken'?'on':''}">Geciken</button>
      <button data-f="bekliyor" class="${odevFilter==='bekliyor'?'on':''}">Bekleyen</button>
      <button data-f="yapildi" class="${odevFilter==='yapildi'?'on':''}">Yapıldı</button>
      <button data-f="hepsi" class="${odevFilter==='hepsi'?'on':''}">Hepsi</button>
    </div>
    <button class="btn brand block" style="margin-top:12px" onclick="openOdevForm()">＋ Yeni ödev</button>
    <div id="odevList" class="list" style="margin-top:14px"><div class="sk"></div><div class="sk"></div></div>`;
  $$('#ofSeg button').forEach(b=>b.onclick=()=>{odevFilter=b.dataset.f;renderOdev();});
  const q=db.from('odevler').select('*').order('teslim_tarihi',{nullsFirst:false}).order('verilis_tarihi',{ascending:false});
  const {data:raw,error}=await q;
  const list=$('#odevList');
  if(error){list.innerHTML=`<div class="empty">Yüklenemedi: ${esc(error.message)}</div>`;return;}
  const today=todayISO();
  const gecMi=o=>o.durum!=='yapildi' && o.teslim_tarihi && o.teslim_tarihi<today;
  let data=raw||[];
  if(odevFilter==='geciken') data=data.filter(gecMi);
  else if(odevFilter==='bekliyor') data=data.filter(o=>o.durum!=='yapildi' && !gecMi(o));
  else if(odevFilter==='yapildi') data=data.filter(o=>o.durum==='yapildi');
  if(!data.length){list.innerHTML=`<div class="empty">Bu filtrede ödev yok.</div>`;return;}
  const srcIcon={okul:'🏫',dershane:'📘',veli:'👨‍👩‍👦',diger:'•'};
  const srcLabel={dershane:'Dershane',okul:'Okul',veli:'Veli',diger:'Diğer'};
  const card=o=>{
    const gec = o.durum!=='yapildi' && o.teslim_tarihi && o.teslim_tarihi<todayISO();
    const col = o.durum==='yapildi'?'ok':(gec?'bad':'warn');
    return `<div class="item">
      <div class="dot" style="background:var(--${col})"></div>
      <div style="flex:1;min-width:0;cursor:pointer" onclick="odevAc(${o.id})" title="Detay / sonuç gir">
        <div class="t">${esc(o.baslik||'Ödev')} <span style="color:var(--ink-3);font-weight:600">›</span></div>
        <div class="d">${esc(o.kurum||srcLabel[o.kaynak]||o.kaynak)} · ${dersAd(o.ders_id)}${o.materyal?' · '+esc(o.materyal):''}${o.teslim_tarihi?' · teslim '+trDate(o.teslim_tarihi):''}</div>
      </div>
      ${o.durum==='yapildi' ? `<span class="chip ok">✓</span>` : ''}
    </div>`;
  };
  const groups={}; data.forEach(o=>{(groups[o.kaynak]=groups[o.kaynak]||[]).push(o);});
  let html='';
  ['dershane','okul','veli','diger'].forEach(k=>{
    const arr=groups[k]; if(!arr||!arr.length)return;
    html+=`<h2 class="sec" style="display:flex;align-items:center;gap:7px">${srcIcon[k]||''} ${srcLabel[k]} <span style="font-weight:600;color:var(--ink-3);font-size:13px">(${arr.length})</span></h2>`;
    html+=arr.map(card).join('');
  });
  list.innerHTML=html;
}
async function odevAc(id){
  const {data}=await db.from('odevler').select('*').eq('id',id).single();
  // ödev detayı: sonuç/optik form akışına gir
  openResultSheet({fromOdev:data});
}
const SIL_PAROLA="1907";
async function odevSil(id){
  const pw=prompt('Ödev silme parolası:');
  if(pw===null) return;                    // iptal
  if(pw!==SIL_PAROLA){ toast('Parola yanlış'); return; }
  await db.from('odevler').update({durum:'yapildi'}).eq('id',id); // güvenli: DELETE engelli olabilir
  const {error}=await db.from('odevler').delete().eq('id',id);
  if(error){ toast('Silinemedi'); return; }
  closeSheet(); toast('Ödev silindi'); renderOdev();
}

function resetCheck(ctx){
  ctx.checked=false; ctx.photos={}; ctx._needQs=[];
  const g=$('#ansGrid'); if(g)g.classList.remove('locked');
  $$('#ansGrid .opts b').forEach(x=>x.classList.remove('fillok','ringok','ringko'));
  $$('#ansGrid .acell').forEach(c=>{ c.classList.remove('needphoto'); const cb=c.querySelector('.cam-btn'); if(cb)cb.remove(); });
  $('#netOut').textContent='—'; $('#dybOut').textContent='—';
  const ps=$('#photoStat'); if(ps){ ps.style.display='none'; ps.classList.remove('ok'); }
  const kc=$('#k_check'); if(kc)kc.disabled=false;
  const ks=$('#k_save'); if(ks)ks.disabled=true;
  if(ctx.hasMSK){ ctx.autoKonu={}; renderAutoKonu(ctx); }
}
function updatePhotoStatus(ctx){
  const need=ctx._needQs||[];
  const have=need.filter(n=>ctx.photos[n.q]).length;
  const all=have>=need.length;
  const ps=$('#photoStat');
  if(ps){
    ps.style.display='block';
    ps.classList.toggle('ok',all);
    ps.innerHTML = need.length
      ? `📷 Yanlış/boş soruların fotoğrafı: <b>${have}/${need.length}</b>${all?' · tamam ✓':' · her birinin yanındaki 📷 ile çek'}`
      : 'Yanlış/boş soru yok · tüm cevaplar doğru 🎉';
  }
  const ks=$('#k_save'); if(ks) ks.disabled = !(ctx.checked && all);
}
// Fotoğrafı tarayıcıda küçült (en fazla ~1280px, JPEG) → küçük dosya
function compressImage(file, maxDim=1280, quality=0.72){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width:w,height:h}=img;
      if(Math.max(w,h)>maxDim){ const s=maxDim/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(b=> b?resolve(b):reject(new Error('blob')), 'image/jpeg', quality);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}
// ctx.photos'u Supabase Storage'a yükle → [{soru_no,tip,foto_path,foto_url}]
async function uploadPhotos(ctx){
  const need=ctx._needQs||[]; const out=[];
  for(const item of need){
    const q=item.q, tip=item.tip;
    const blob=ctx.photos[q]; if(!blob) continue;
    const path=`${ctx.test.id}/${Date.now()}_${q}.jpg`;
    const up=await db.storage.from('yanlis-foto').upload(path, blob, {contentType:'image/jpeg', upsert:true});
    if(up.error) throw up.error;
    const url=db.storage.from('yanlis-foto').getPublicUrl(path).data.publicUrl;
    out.push({soru_no:q, tip, foto_path:path, foto_url:url});
  }
  return out;
}
function gradeCA(ctx){
  let d=0,y=0,b=0; const wrongQs=[]; const needQs=[];
  ctx.CA.forEach(c=>{ const a=ctx.answers[c.soru_no]; if(!a){b++; needQs.push({q:c.soru_no,tip:'bos'});} else if(a===c.dogru_cevap){d++;} else {y++; wrongQs.push(c.soru_no); needQs.push({q:c.soru_no,tip:'yanlis'});} });
  $('#netOut').textContent=fnet(d,y); $('#dybOut').textContent=`${d} / ${y} / ${b}`;
  const needSet=new Set(needQs.map(n=>n.q));
  $$('#ansGrid .acell').forEach(cell=>{
    const q=+cell.dataset.q;
    const corr=(ctx.CA.find(c=>c.soru_no==q)||{}).dogru_cevap;
    const a=ctx.answers[q];
    $$('b',cell).forEach(x=>x.classList.remove('fillok','ringok','ringko'));
    // doğru şıkkın içini her durumda yeşil doldur (doğru / yanlış / boş)
    const cb=$$('b',cell).find(x=>x.dataset.o===corr); if(cb)cb.classList.add('fillok');
    if(a){
      const mb=$$('b',cell).find(x=>x.dataset.o===a);
      if(mb) mb.classList.add(a===corr?'ringok':'ringko'); // doğru→yeşil halka, yanlış→kırmızı halka
    }
    // yanlış/boş → kamera butonu
    cell.querySelector('.cam-btn')?.remove();
    if(needSet.has(q)){
      cell.classList.add('needphoto');
      const btn=document.createElement('button');
      btn.type='button'; btn.className='cam-btn'+(ctx.photos[q]?' done':''); btn.dataset.q=q;
      btn.title='Bu sorunun fotoğrafını çek'; btn.textContent=ctx.photos[q]?'✓':'📷';
      btn.onclick=(e)=>{ e.stopPropagation(); ctx._camQ=q; $('#camInput').click(); };
      cell.appendChild(btn);
    } else {
      cell.classList.remove('needphoto');
    }
  });
  ctx._dyb={d,y,b}; ctx._wrongQs=wrongQs; ctx._needQs=needQs;
  // auto konu from MSK
  if(ctx.hasMSK){
    const auto={}; wrongQs.forEach(q=>{ const m=ctx.MSK.find(x=>x.soru_no==q); if(m&&m.konu_id){ auto[m.konu_id]=(auto[m.konu_id]||0)+1; } });
    ctx.autoKonu=auto; renderAutoKonu(ctx);
  }
}
function renderAutoKonu(ctx){
  const box=$('#konuAuto'); if(!box)return;

  box.innerHTML = ents.length? ents.map(([id,n])=>`<span class="chip bad">${esc((S.konby[id]||{}).ad||'?')} ×${n}</span>`).join(' ')
     : `<span class="tiny muted">Yanlış seçtikçe konular otomatik çıkacak.</span>`;

  box.innerHTML=`<div class="konu-pick" style="max-height:320px">${ts.map(t=>{
    const dn=done[t.id]; const n=cnt[t.id]||0; const q=soruStr(t.soru_sayisi);
    return `<div class="kline" data-tid="${t.id}" style="cursor:pointer"><span class="kn" style="font-size:13px">${esc(testLabel(t))}${q?` <span style="color:var(--ink-3);font-weight:500">· ${q}</span>`:''} <span style="color:var(--ink-3)">›</span></span>${dn?`<span class="chip ok" style="font-size:11px">✓ net ${fnet(dn.d,dn.y)}${n>1?` · ${n}×`:''}</span>`:`<span class="chip" style="font-size:11px">yapılmadı</span>`}</div>`;
  }).join('')}</div>`;
  box.querySelector('.konu-pick').onclick=e=>{ const row=e.target.closest('.kline'); if(!row)return; const t=ts.find(x=>x.id==row.dataset.tid); if(t) openKitapTest(t, mat.ders_id, mat.ad); };
}
function openKitapTest(test, dersId, matName){
  const sd=$('#view-sonuc #k_dyn'); if(sd) sd.innerHTML=''; // Sonuç sekmesiyle ID çakışmasını önle
  sheet(`<h3>${esc(testLabel(test))}</h3><p class="hint">${esc(matName||'')}</p><div id="kt_dyn"></div>`);
  buildKitapEntry(test, dersId, $('#kt_dyn'));
}

/* ----- ANALİZ ----- */
let analizDers='';
async function renderAnaliz(){
  const el=$('#view-analiz');
  const dersOpts=`<option value="">Tüm dersler</option>`+S.dersler.map(d=>`<option value="${d.id}" ${analizDers==d.id?'selected':''}>${esc(d.ad)}</option>`).join('');
  el.innerHTML=`<label class="fld" style="margin-top:16px"><span class="lab">Ders</span><select id="an_ders">${dersOpts}</select></label>
    <div id="an_body" style="margin-top:14px"><div class="sk"></div><div class="sk"></div></div>`;
  $('#an_ders').onchange=()=>{analizDers=$('#an_ders').value;renderAnaliz();};
  // yanlis_konular + konu + ders
  const {data,error}=await db.from('yanlis_konular').select('adet,konu_id,konular(ad,ders_id)');
  const body=$('#an_body');
  if(error){body.innerHTML=`<div class="empty">Yüklenemedi</div>`;return;}
  let rows=data||[];
  if(analizDers) rows=rows.filter(r=>r.konular && r.konular.ders_id==analizDers);
  const agg={};
  rows.forEach(r=>{ if(!r.konular)return; const key=r.konu_id; agg[key]=agg[key]||{ad:r.konular.ad,ders:r.konular.ders_id,n:0}; agg[key].n+=r.adet||1; });
  const list=Object.values(agg).sort((a,b)=>b.n-a.n);
  const max=list.length?list[0].n:1;
  const toplam=list.reduce((s,x)=>s+x.n,0);
  if(!list.length){ body.innerHTML=`<div class="empty">Henüz yanlış konu verisi yok.<br>Sonuç girdikçe buraya konu bazında zayıflık haritası çıkacak.</div>`; return; }
  body.innerHTML=`<div class="stat" style="margin-bottom:12px"><div class="n">${toplam}</div><div class="l">Toplam yanlış (işaretlenen konu)</div></div>
    <div class="card pad">
    ${list.map(x=>`<div style="margin-top:4px">
       <div class="barrow"><div class="nm">${esc(x.ad)}${analizDers?'':` <span class="tiny">· ${dersAd(x.ders)}</span>`}</div><span class="chip ${x.n>=max*0.66?'bad':(x.n>=max*0.33?'warn':'')}">${x.n}</span></div>
       <div class="bar ${x.n>=max*0.5?'bad':''}"><i style="width:${Math.max(7,x.n/max*100)}%"></i></div>
     </div>`).join('')}
    </div>`;
}

/* ----- RESULT SHEET (ödevden) ----- */
function openResultSheet({fromOdev}){
  // ödev detayı: bu ödeve bağlı testler + test ekleme + çözme
  sheet(`<h3>${esc(fromOdev.baslik||'Ödev')}</h3>
    <p class="hint">${esc(dersAd(fromOdev.ders_id))}${fromOdev.materyal?' · '+esc(fromOdev.materyal):''}${fromOdev.teslim_tarihi?' · teslim '+trDate(fromOdev.teslim_tarihi):''}</p>
    <div id="rsBody"><div class="sk" style="margin-top:12px"></div></div>
    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      <button class="btn block" style="color:var(--bad);border-color:var(--bad-soft)" onclick="odevSil(${fromOdev.id})">🗑 Ödevi sil</button>
    </div>`);
  renderOdevTests(fromOdev);
}

async function renderOdevTests(odev){
  const body=$('#rsBody'); if(!body) return;
  const {data:links}=await db.from('odev_test')
    .select('id,materyal_test_id,materyal_testleri(id,unite,bolum,tip,test_no,konu_id,soru_sayisi,materyal_id)')
    .eq('odev_id',odev.id);
  const rows=(links||[]).filter(l=>l.materyal_testleri);
  const tids=rows.map(r=>r.materyal_test_id);
  const done={};
  if(tids.length){
    const {data}=await db.from('sonuclar').select('materyal_test_id,dogru,yanlis,bos,cozum_tarihi')
      .in('materyal_test_id',tids).order('cozum_tarihi',{ascending:false});
    (data||[]).forEach(s=>{ if(s.materyal_test_id && !done[s.materyal_test_id]) done[s.materyal_test_id]=s; });
  }
  // ödev kitabını katalogla eşleştir (serbest metin → materyal)
  const matched=Object.values(S.matById).find(m=>m.ad===odev.materyal);

  let h=`<h2 class="sec" style="margin-top:4px">Bu ödevin testleri</h2>`;
  if(rows.length){
    h+=`<div class="card" style="padding:2px 0;margin-bottom:10px">`+rows.map(r=>{
      const t=r.materyal_testleri, s=done[r.materyal_test_id];
      const st= s? `<span class="chip ok">net ${fnet(s.dogru,s.yanlis)}</span>` : `<span class="chip">çözülmedi</span>`;
      const q=soruStr(t.soru_sayisi);
      return `<div class="row" style="justify-content:space-between;gap:8px;padding:9px 13px;border-top:1px solid var(--line)">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="solveOdevTest(${odev.id},${t.id})">
          <div style="font-weight:650;font-size:13.5px">${esc(testLabel(t))} ›</div>
          ${q?`<div class="tiny">${q}</div>`:''}
        </div>
        ${st}
        <button class="btn sm" title="Çıkar" onclick="unlinkOdevTest(${r.id},${odev.id})" style="padding:4px 9px;color:var(--bad)">✕</button>
      </div>`;
    }).join('')+`</div>`;
  } else {
    h+=`<p class="hint" style="margin:6px 0 10px">Henüz test eklenmedi. Öğretmenin verdiği sayfalar hangi test(ler)e denk geliyorsa aşağıdan seçip ekle.</p>`;
  }
  h+=`<div class="card" style="padding:12px">
      <div class="tiny" style="margin-bottom:8px;font-weight:700">Test ekle</div>
      <label class="fld" style="margin:0 0 8px"><span class="lab">Kitap</span><select id="ot_mat"></select></label>
      <label class="fld" style="margin:0 0 10px"><span class="lab">Test</span><select id="ot_test"><option value="">— Önce kitap seçin —</option></select></label>
      <button class="btn brand block" id="ot_add">+ Ekle</button>
    </div>`;
  body.innerHTML=h;

  // kitap seçenekleri: eşleşen en üstte, sonra derse göre
  const mats=[...Object.values(S.matById)].sort((a,b)=>{
    if(matched){ if(a.id===matched.id)return -1; if(b.id===matched.id)return 1; }
    return (a.ders_id-b.ders_id) || a.ad.localeCompare(b.ad,'tr');
  });
  const ms=$('#ot_mat'), tsel=$('#ot_test');
  ms.innerHTML=`<option value="">— Seçiniz —</option>`+mats.map(m=>`<option value="${m.id}" ${matched&&m.id===matched.id?'selected':''}>${esc(m.ad)} · ${esc(dersAd(m.ders_id))}</option>`).join('');
  const linked=new Set(tids);
  const fillTests=async()=>{
    if(!ms.value){ tsel.innerHTML='<option value="">— Önce kitap seçin —</option>'; return; }
    const ts=await testsOf(+ms.value);
    tsel.innerHTML=`<option value="">— Test seçin —</option>`+ts.map(t=>`<option value="${t.id}" ${linked.has(t.id)?'disabled':''}>${testOpt(t)}${linked.has(t.id)?' • ekli':''}</option>`).join('');
  };
  ms.onchange=fillTests;
  if(ms.value) fillTests();
  $('#ot_add').onclick=async()=>{
    const tid=+tsel.value; if(!tid){ toast('Önce test seç'); return; }
    const {error}=await db.from('odev_test').insert({odev_id:odev.id,materyal_test_id:tid});
    if(error){ toast(String(error.code)==='23505'?'Bu test zaten ekli':'Eklenemedi'); return; }
    toast('Test eklendi'); renderOdevTests(odev);
  };
}

async function unlinkOdevTest(linkId,odevId){
  const {error}=await db.from('odev_test').delete().eq('id',linkId);
  if(error){ toast('Çıkarılamadı'); return; }
  toast('Test çıkarıldı');
  const {data}=await db.from('odevler').select('*').eq('id',odevId).single();
  if(data) renderOdevTests(data);
}

async function solveOdevTest(odevId,testId){
  const [oR,tR]=await Promise.all([
    db.from('odevler').select('*').eq('id',odevId).single(),
    db.from('materyal_testleri').select('*').eq('id',testId).single()
  ]);
  const odev=oR.data, test=tR.data;
  if(!test){ toast('Test bulunamadı'); return; }
  const sd=$('#view-sonuc #k_dyn'); if(sd) sd.innerHTML=''; // Sonuç sekmesiyle ID çakışmasını önle
  sheet(`<button class="btn sm" id="ot_back" style="margin-bottom:8px">‹ Ödeve dön</button>
    <h3>${esc(testLabel(test))}</h3>
    <p class="hint">${esc(odev.materyal||dersAd(odev.ders_id))}</p>
    <div id="rs_dyn"></div>`);
  $('#ot_back').onclick=()=>openResultSheet({fromOdev:odev});
  await buildKitapEntry(test, odev.ders_id, $('#rs_dyn'));
  const ctx2=window._kitapCtx; ctx2._odev=odev;
  $('#k_save').onclick=async()=>{ await saveFromOdev(ctx2); };
}
async function saveFromOdev(ctx){
  let d,y,b;
  if(ctx.hasCA){({d,y,b}=ctx._dyb||{d:0,y:0,b:0}); if(d+y+b===0){toast('Şıkları işaretle');return;}
    const need=ctx._needQs||[]; if(need.some(n=>!ctx.photos[n.q])){ toast('Önce yanlış/boş soruların fotoğrafını çek'); return; }}
  else {d=+$('#m_d').value||0;y=+$('#m_y').value||0;b=+$('#m_b').value||0;}
  $('#k_save').disabled=true;
  let fotos=[];
  if(ctx.hasCA){ try{ fotos=await uploadPhotos(ctx); }catch(e){ toast('Fotoğraf yüklenemedi, tekrar dene'); $('#k_save').disabled=false; return; } }
  const sRes=await db.from('sonuclar').insert({odev_id:ctx._odev.id,ders_id:ctx.dersId,materyal_test_id:ctx.test.id,dogru:d,yanlis:y,bos:b,cozum_tarihi:$('#k_date').value||todayISO()}).select('id').single();
  if(!sRes.error){ const konu=ctx.hasMSK?(ctx.autoKonu||{}):(ctx.manualKonu||{}); const yk=Object.entries(konu).map(([k,a])=>({sonuc_id:sRes.data.id,konu_id:+k,adet:a})); if(yk.length)await db.from('yanlis_konular').insert(yk);
    if(fotos.length){ const rows=fotos.map(f=>({sonuc_id:sRes.data.id,materyal_test_id:ctx.test.id,soru_no:f.soru_no,tip:f.tip,foto_path:f.foto_path,foto_url:f.foto_url})); const r=await db.from('yanlis_foto').insert(rows); if(r.error)toast('Fotoğraf kaydı yazılamadı'); } }
  // Otomatik tescil: ödeve bağlı TÜM testler çözüldüyse ödevi "yapıldı" yap
  const {data:links}=await db.from('odev_test').select('materyal_test_id').eq('odev_id',ctx._odev.id);
  const tids=(links||[]).map(l=>l.materyal_test_id);
  let allDone=tids.length>0;
  if(tids.length){
    const {data:res}=await db.from('sonuclar').select('materyal_test_id').eq('odev_id',ctx._odev.id).in('materyal_test_id',tids);
    const solved=new Set((res||[]).map(r=>r.materyal_test_id));
    allDone=tids.every(t=>solved.has(t));
  }
  if(allDone) await db.from('odevler').update({durum:'yapildi'}).eq('id',ctx._odev.id);
  closeSheet(); toast(allDone?`Kaydedildi · ödev yapıldı · net ${fnet(d,y)}`:`Kaydedildi · net ${fnet(d,y)}`); renderOdev();
}

/* ---------- SHEET ---------- */
function sheet(html){ $('#sheet').innerHTML=`<button class="sheet-close" onclick="closeSheet()" title="Kapat (kaydetmeden)" aria-label="Kapat">✕</button><div class="grab"></div>`+html; $('#sheetBg').classList.add('open'); }
function closeSheet(){ $('#sheetBg').classList.remove('open'); }
/* dışarı tıklayınca kapanmaz; yalnızca ✕ ile kapanır */

/* ---------- BOOT ---------- */
async function startApp(){
  $('#appTop').classList.remove('hidden'); $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden'); $('#fab').classList.remove('hidden');
  $$('#nav .tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  $('#themeBtn').onclick=toggleTheme;
  $('#homeBtn').onclick=()=>setView('ozet');
  $('#refreshBtn').onclick=()=>setView(S.view);
  $('#fab').onclick=()=>{ if(S.view==='odev') openOdevForm(); else setView('sonuc'); };
  try{ await loadCatalog(); }
  catch(e){ $('#view-ozet').innerHTML=`<div class="empty" style="margin-top:30px">Bağlantı hatası:<br>${esc(e.message||e)}<br><br>İnternet bağlantını kontrol et.</div>`; return; }
  setView('ozet');
}
