function fotoKaynak(r){ return (r.vektor_durum==='hazir'&&r.vektor_url)?'vektör':(r.temiz_url?'temiz':'orijinal'); }
async function renderTekrar(){
  const el=$('#view-tekrar');
  el.innerHTML=`<div class="sk" style="margin-top:16px"></div>`;
  const [fR, caR] = await Promise.all([
    db.from('yanlis_foto').select('id,sonuc_id,konu_id,materyal_test_id,soru_no,tip,foto_url,temiz_url,vektor_url,vektor_durum,ogrenildi,materyal_testleri(id,unite,bolum,test_no,materyal_id,materyaller(ad,ders_id))').eq('ogrenildi',false).order('created_at'),
    db.from('cevap_anahtari').select('materyal_test_id,soru_no,dogru_cevap')
  ]);
  const rows=(fR.data||[]).filter(r=>r.materyal_testleri);
  const caMap={}; (caR.data||[]).forEach(c=>caMap[c.materyal_test_id+'-'+c.soru_no]=c.dogru_cevap);
  rows.forEach(r=>{ r._correct=caMap[r.materyal_test_id+'-'+r.soru_no]||null; r._t=r.materyal_testleri; r._mat=r._t.materyaller||{}; });

  if(!rows.length){ el.innerHTML=`<div class="empty" style="margin-top:34px">Tekrar edilecek yanlış soru yok 🎉<br><span class="tiny">Yanlış/boş yapılan sorular burada toplanır.</span></div>`; return; }

  // teste göre grupla
  const groups={};
  rows.forEach(r=>{ (groups[r.materyal_test_id]=groups[r.materyal_test_id]||{t:r._t,mat:r._mat,items:[]}).items.push(r); });
  const gArr=Object.values(groups).sort((a,b)=>(a.mat.ders_id-b.mat.ders_id)||a.mat.ad.localeCompare(b.mat.ad,'tr'));

  window._tekrarAll=rows;
  let h=`<div class="row" style="justify-content:space-between;align-items:center;margin:16px 2px 10px">
      <div><div style="font-weight:800;font-size:20px">${rows.length}</div><div class="tiny">tekrar edilecek yanlış soru</div></div>
      <button class="btn brand" onclick="tekrarBasla(window._tekrarAll)">🎲 Karışık başla</button>
    </div>`;
  let curD=null;
  gArr.forEach(g=>{
    if(g.mat.ders_id!==curD){ curD=g.mat.ders_id; h+=`<h2 class="sec">${esc(dersAd(curD))}</h2>`; }
    const lbl=testLabel({unite:g.t.unite,bolum:g.t.bolum,test_no:g.t.test_no,id:g.t.id});
    h+=`<div class="card" style="padding:12px 14px;margin-bottom:8px">
        <div class="row" style="justify-content:space-between;align-items:center;gap:10px">
          <div style="min-width:0"><div style="font-weight:650;font-size:13.5px">${esc(g.mat.ad||'')}</div>
            <div class="tiny">${esc(lbl)} · ${g.items.length} yanlış soru</div></div>
          <button class="btn sm brand" onclick='tekrarBasla(window._tekrarAll.filter(x=>x.materyal_test_id==${g.t.id}))'>Başla ›</button>
        </div>
        ${isVeli()?`<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">
          ${g.items.map(it=>`<button class="soru-chip ${it.konu_id?'has':''}" onclick="openSoruDuzenleById(${it.id})">Soru ${it.soru_no}${it.tip==='bos'?' · boş':''}${it.konu_id?' ●':''}</button>`).join('')}
        </div>
        <div class="tiny" style="margin-top:7px;color:var(--ink-3)">Başla: öğrenci çözer · Soruya dokun: çizim ve konu düzenle</div>`:''}
      </div>`;
  });
  el.innerHTML=h;
}

function tekrarBasla(items){
  if(!items||!items.length){ toast('Soru yok'); return; }
  const list=[...items].sort(()=>Math.random()-0.5);
  const state={list,i:0,ogrenildi:0,kalan:0,showOrig:false};
  tekrarGoster(state);
}
async function saveSoruKonu(fotoId, sonucId, konuId){
  const r=await db.from('yanlis_foto').update({konu_id:konuId||null}).eq('id',fotoId);
  if(r.error){ toast('Kaydedilemedi: '+r.error.message); return false; }
  // ait olduğu çözümün yanlis_konular özetini yeniden kur
  if(sonucId){
    const {data:all}=await db.from('yanlis_foto').select('konu_id').eq('sonuc_id',sonucId);
    const agg={}; (all||[]).forEach(x=>{ if(x.konu_id){ agg[x.konu_id]=(agg[x.konu_id]||0)+1; } });
    await db.from('yanlis_konular').delete().eq('sonuc_id',sonucId);
    const yk=Object.entries(agg).map(([k,a])=>({sonuc_id:sonucId,konu_id:+k,adet:a}));
    if(yk.length){ const ir=await db.from('yanlis_konular').insert(yk); if(ir.error){ toast('Konu özeti yazılamadı'); return false; } }
  }
  return true;
}
function requireEdit(cb){ if(isVeli()){ cb(); } else { toast('Bu bölüm veli içindir (1907 ile giriş)'); } }
function openSoruDuzenleById(id){ const r=(window._tekrarAll||[]).find(x=>x.id===id); if(!r){ toast('Soru bulunamadı'); return; } openSoruDuzenle(r); }
function openSoruDuzenle(r){
  const src=bestFotoUrl(r);
  const ks=S.konByDers[(r._mat&&r._mat.ders_id)]||[];
  const konuOpts=`<option value="">— konu seç —</option>`+ks.map(k=>`<option value="${k.id}" ${String(r.konu_id)===String(k.id)?'selected':''}>${esc(k.ad)}</option>`).join('');
  const t=r._t||{}; const lbl=testLabel({unite:t.unite,bolum:t.bolum,test_no:t.test_no,id:t.id});
  sheet(`<h3 style="margin-top:2px">Soru ${r.soru_no} · ${r.tip==='bos'?'boş':'yanlış'}</h3>
    <p class="hint">${esc((r._mat&&r._mat.ad)||'')} · ${esc(lbl)}</p>
    <div class="tkimg-wrap" id="sd_imgwrap" title="Çizimi düzenlemek için dokun" style="cursor:pointer"><img class="tkimg" id="sd_img" src="${esc(src)}" alt="soru"></div>
    <div class="row" style="justify-content:space-between;margin:8px 2px 2px;gap:6px;flex-wrap:wrap">
      <button class="btn sm brand" id="sd_edit">✎ Çizimi düzenle</button>
      <button class="btn sm" id="sd_orig">Orijinali gör</button>
    </div>
    <h2 class="sec" style="margin-top:16px">Konu</h2>
    <div class="row" style="gap:8px;align-items:center">
      <span class="tiny" style="white-space:nowrap;font-weight:650">Hangi konudan?</span>
      <select id="sd_konu" class="konu-sel" style="flex:1;max-width:none">${ks.length?konuOpts:'<option value="">(bu ders için konu yok)</option>'}</select>
    </div>
    <button class="btn brand block" id="sd_save" style="margin-top:16px">Kaydet</button>
    <p class="tiny" style="margin:8px 2px 0;color:var(--ink-3);text-align:center">Kaydetmeden çıkmak için sağ üstteki ✕</p>`);
  let showOrig=false, pendingKonu=(r.konu_id!=null?r.konu_id:null);
  $('#sd_orig').onclick=()=>{ showOrig=!showOrig; $('#sd_img').src= showOrig?(r.foto_url||src):bestFotoUrl(r); $('#sd_orig').textContent= showOrig?'Temiz/vektör hali':'Orijinali gör'; };
  const openEdit=()=>openVektorEditor(r.id, async()=>{
    const {data}=await db.from('yanlis_foto').select('vektor_url,vektor_durum,temiz_url,foto_url').eq('id',r.id).single();
    if(data){ Object.assign(r,data); const im=$('#sd_img'); if(im) im.src=bestFotoUrl(r); showOrig=false; const ob=$('#sd_orig'); if(ob)ob.textContent='Orijinali gör'; }
  });
  $('#sd_edit').onclick=openEdit; $('#sd_imgwrap').onclick=openEdit;
  const ksel=$('#sd_konu');
  if(ksel && ks.length) ksel.onchange=()=>{ pendingKonu = ksel.value?+ksel.value:null; };
  $('#sd_save').onclick=async()=>{
    const btn=$('#sd_save'); btn.disabled=true; btn.textContent='Kaydediliyor…';
    const ok=await saveSoruKonu(r.id, r.sonuc_id, pendingKonu);
    btn.disabled=false; btn.textContent='Kaydet';
    if(ok){ r.konu_id=pendingKonu; toast('Kaydedildi ✓'); closeSheet(); setView('tekrar'); }
  };
}
function tekrarGoster(st){
  const r=st.list[st.i];
  const total=st.list.length, n=st.i+1;
  const src=bestFotoUrl(r), kaynak=fotoKaynak(r);
  const tipEt = r.tip==='bos'?'Boş bırakılmıştı':'Yanlış yapılmıştı';
  sheet(`<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="tiny">${n} / ${total}</span>
      <span class="row" style="gap:6px">
        ${(r.ustuste_dogru||0)>0?`<span class="chip ok">seri ${r.ustuste_dogru}/${TEKRAR_ESIK}</span>`:''}
        <span class="chip ${r.tip==='bos'?'':'bad'}">${tipEt}</span>
      </span>
    </div>
    <div class="tkimg-wrap"><img class="tkimg" id="tk_img" src="${esc(src)}" alt="soru"></div>
    <p class="hint" style="margin:12px 2px 6px">Doğru cevabı işaretle:</p>
    <div class="tk-opts" id="tk_opts">${['A','B','C','D'].map(o=>`<button class="tk-opt" data-o="${o}">${o}</button>`).join('')}</div>
    <div id="tk_fb" style="margin-top:12px"></div>`);
  const opts=$('#tk_opts');
  opts.onclick=async (e)=>{
    const b=e.target.closest('.tk-opt'); if(!b||st._answered) return;
    st._answered=true;
    const pick=b.dataset.o, correct=r._correct;
    $$('.tk-opt',opts).forEach(x=>{ x.disabled=true;
      if(correct && x.dataset.o===correct) x.classList.add('ok');
      if(x.dataset.o===pick && pick!==correct) x.classList.add('ko');
    });
    const dogru = correct && pick===correct;
    // DB güncelle: üst üste TEKRAR_ESIK doğru → öğrenildi; yanlış → seri sıfırlanır
    let ogr=false, seri=0, vardi=(r.ustuste_dogru||0)>0;
    if(dogru){
      seri=(r.ustuste_dogru||0)+1; ogr=seri>=TEKRAR_ESIK;
      await db.from('yanlis_foto').update({ustuste_dogru:seri, ogrenildi:ogr, son_tekrar:new Date().toISOString(), tekrar_dogru:(r.tekrar_dogru||0)+1}).eq('id',r.id);
      r.ustuste_dogru=seri; r.ogrenildi=ogr;
      if(ogr) st.ogrenildi++; else st.kalan++;
    } else {
      await db.from('yanlis_foto').update({ustuste_dogru:0, son_tekrar:new Date().toISOString(), tekrar_yanlis:(r.tekrar_yanlis||0)+1}).eq('id',r.id);
      r.ustuste_dogru=0; st.kalan++;
    }
    const mesaj = (dogru&&ogr) ? `Doğru! ✓ ${TEKRAR_ESIK} kez üst üste — öğrenildi`
      : dogru ? `Doğru! Seri ${seri}/${TEKRAR_ESIK} · bir sonraki tekrarda da doğru yaparsan öğrenilecek`
      : (correct?('Yanlış · doğru cevap '+correct):'Yanlış');
    const altNot = (dogru&&ogr) ? '' : dogru ? 'Soru havuzda kalacak.' : (vardi?'Seri sıfırlandı · soru havuzda kalacak.':'Soru havuzda kalacak.');
    $('#tk_fb').innerHTML = `<div class="card" style="padding:12px;border-color:${dogru?'var(--okg)':'var(--kor)'}">
        <div style="font-weight:700;color:${dogru?'var(--okg)':'var(--kor)'}">${mesaj}</div>
        ${altNot?`<div class="tiny" style="margin-top:4px">${altNot}</div>`:''}
      </div>
      <button class="btn brand block" style="margin-top:12px" id="tk_next">${st.i+1<total?'Sonraki soru ›':'Bitir'}</button>`;
    $('#tk_next').onclick=()=>{
      if(st.i+1<total){ st.i++; st._answered=false; st.showOrig=false; tekrarGoster(st); }
      else tekrarBitir(st);
    };
  };
}
function tekrarBitir(st){
  sheet(`<div style="text-align:center;padding:14px 4px">
      <div style="font-size:40px">🏁</div>
      <h3 style="margin:8px 0 4px">Tekrar bitti</h3>
      <p class="hint" style="margin:0 0 14px">${st.ogrenildi} soru öğrenildi · ${st.kalan} soru havuzda kaldı</p>
      <button class="btn brand block" onclick="closeSheet();setView('tekrar')">Tamam</button>
    </div>`);
}

/* ---------- SHEET ---------- */
function sheet(html){ $('#sheet').innerHTML=`<button class="sheet-close" onclick="closeSheet()" title="Kapat (kaydetmeden)" aria-label="Kapat">✕</button><div class="grab"></div>`+html; $('#sheetBg').classList.add('open'); }
function closeSheet(){ $('#sheetBg').classList.remove('open'); }
/* dışarı tıklayınca kapanmaz; yalnızca ✕ ile kapanır */

/* ---------- BOOT ---------- */
async function startApp(){
  $('#appTop').classList.remove('hidden'); $('#app').classList.remove('hidden'); $('#nav').classList.remove('hidden'); $('#fab').classList.remove('hidden');
  $$('#nav .tab').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  $('#themeBtn').onclick=toggleTheme;
  $('#homeBtn').onclick=()=>setView('ozet');
  $('#refreshBtn').onclick=()=>setView(S.view);
  $('#fab').onclick=()=>{ if(S.view==='odev') openOdevForm(); else setView('sonuc'); };
  try{ await loadCatalog(); }
  catch(e){ $('#view-ozet').innerHTML=`<div class="empty" style="margin-top:30px">Bağlantı hatası:<br>${esc(e.message||e)}<br><br>İnternet bağlantını kontrol et.</div>`; return; }
  setView('ozet');
}
openGate();
</script>
<script>
/* PWA: service worker kaydı + otomatik güncelleme */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const check = () => { try { reg.update(); } catch (_) {} };
      // uygulama öne gelince yeni sürümü kontrol et
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
      // yeni SW etkinleşince (güncelleme) sayfayı bir kez yenile → taze kod
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'activated' && navigator.serviceWorker.controller) window.location.reload();
        });
      });
    }).catch(() => {});
  });
}
</script>
